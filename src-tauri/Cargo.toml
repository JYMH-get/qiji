[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
# 原生 HTTP 下载（绕过 webview CORS，把上游直链落成本地 asset:// 供 <video> 播放）。
# native-tls → Windows 用 schannel，无需 OpenSSL/ring/C 工具链。
# stream → 批量下载（第232轮 download_to）流式落盘，几百 MB 的成片不整个进内存。
# json/multipart → ComfyUI 直连（comfy_http_json / comfy_upload_file：ComfyUI 默认不带 CORS 头，走原生收发）。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json", "multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# 仅 Windows：访问 WebView2 控制器，在 release 关闭 devtools + 浏览器加速键（F12/刷新/打印）。
# 版本对齐 wry 已在用的 webview2-com 0.38 / windows 0.61（见 Cargo.lock），避免拉入重复版本。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
