<style>
  /* ═══ 设计 token（与设计稿 v4 一致，改样式先改这里）═══ */
  :root {
    color-scheme: dark;
    --bg: #0c0e13; --panel: #12151d; --panel2: #181c27; --panel3: #1f2433;
    --line: #232939; --line2: #2d3448;
    --text: #e7eaf3; --mut: #8a91a6; --faint: #59607a;
    --acc: #8b7cf7; --acc-deep: #6f5bd6; --acc-dim: rgba(139,124,247,.14);
    --ok: #41d392; --ok-dim: rgba(65,211,146,.13);
    --warn: #f3b74f; --warn-dim: rgba(243,183,79,.13);
    --bad: #f26d8d; --bad-dim: rgba(242,109,141,.12);
    --info: #5aa7f0; --info-dim: rgba(90,167,240,.13);
    --r-lg: 12px; --r-md: 9px; --r-sm: 6px;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; border-radius: 4px; }
  .hide { display: none !important; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .mut { color: var(--mut); } .faint { color: var(--faint); }
  .ok-t { color: var(--ok); } .bad-t { color: var(--bad); }

  /* ═══ 壳层 ═══ */
  .shell { display: flex; min-height: 100vh; }
  .side { width: 212px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; flex: none; background: #fff; display: grid; place-items: center; overflow: hidden; }
  .brand .logo img { width: 76%; height: 76%; object-fit: contain; display: block; }
  .brand b { font-size: 15px; font-weight: 600; }
  .nav { flex: 1; overflow-y: auto; padding: 2px 10px 10px; }
  .nav .grp { font-size: 11px; color: var(--faint); letter-spacing: 2px; padding: 13px 10px 4px; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin: 1px 0; border-radius: var(--r-md); color: var(--mut); text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: background .12s, color .12s; }
  .nav a:hover { background: var(--panel2); color: var(--text); }
  .nav a.on { background: var(--acc-dim); color: #cfc8ff; border-color: rgba(139,124,247,.22); }
  .nav a svg { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav a .n { font-size: 13.5px; }
  .nav a .cnt { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .side .me { border-top: 1px solid var(--line); padding: 11px 14px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mut); }
  .side .me .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--ok); flex: none; }
  .side .me button { margin-left: auto; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: rgba(12,14,19,.86); backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 20; }
  .top h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .top .sp { flex: 1; }
  .top .health { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mut); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .top .health .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--faint); }
  .top .health .dot.ok { background: var(--ok); } .top .health .dot.bad { background: var(--bad); }
  .views { padding: 20px 24px 60px; }

  /* ═══ 通用组件 ═══ */
  button, .btn { font: inherit; font-size: 13px; color: var(--text); cursor: pointer; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 6px 13px; transition: background .12s, border-color .12s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover { background: var(--panel3); }
  button.pri { background: var(--acc-deep); border-color: var(--acc-deep); color: #fff; font-weight: 500; }
  button.pri:hover { background: var(--acc); border-color: var(--acc); }
  button.ghost { background: none; border-color: transparent; color: var(--mut); }
  button.ghost:hover { background: var(--panel2); color: var(--text); }
  button.danger { background: var(--bad-dim); border-color: rgba(242,109,141,.35); color: var(--bad); }
  button.danger:hover { background: rgba(242,109,141,.2); }
  button.sm { padding: 3px 9px; font-size: 12px; border-radius: var(--r-sm); }
  button.icon { padding: 5px 7px; }
  button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  button:disabled { opacity: .45; cursor: default; }

  input[type=text], input[type=number], input[type=password], input[type=date], select, textarea {
    font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line2); border-radius: var(--r-md); padding: 6px 10px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(139,124,247,.15); }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  /* 数字输入一律去掉原生上下步进键（第167轮用户定：素材上限等窄输入被箭头挡住，直接键入数字即可） */
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { appearance: textfield; -moz-appearance: textfield; }
  /* 表格内联编辑：更瘦、贴底色 */
  td input[type=text], td input[type=number], td input[type=password], td select { padding: 3px 7px; font-size: 12.5px; background: transparent; border-color: transparent; border-radius: var(--r-sm); }
  td input:hover, td select:hover { border-color: var(--line2); background: var(--bg); }
  td input:focus, td select:focus { border-color: var(--acc); background: var(--bg); box-shadow: none; }
  td input[type=checkbox] { accent-color: var(--acc-deep); }

  .search { position: relative; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 1.8; }
  .search input { padding-left: 32px; width: 250px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line2); color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
  .badge.ok { color: var(--ok); background: var(--ok-dim); border-color: rgba(65,211,146,.3); }
  .badge.run { color: var(--warn); background: var(--warn-dim); border-color: rgba(243,183,79,.3); }
  .badge.bad { color: var(--bad); background: var(--bad-dim); border-color: rgba(242,109,141,.3); }
  .badge.info { color: var(--info); background: var(--info-dim); border-color: rgba(90,167,240,.3); }
  .badge.plain::before { display: none; }

  .chip { font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer; color: var(--mut); background: none; border: 1px solid var(--line); user-select: none; }
  .chip:hover { color: var(--text); background: var(--panel2); }
  .chip.on { color: #cfc8ff; background: var(--acc-dim); border-color: rgba(139,124,247,.35); }

  .sw { position: relative; display: inline-block; width: 32px; height: 18px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--panel3); border: 1px solid var(--line2); transition: background .15s; cursor: pointer; }
  .sw i::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 99px; background: var(--mut); top: 2px; left: 2px; transition: transform .15s, background .15s; }
  .sw input:checked + i { background: var(--acc-deep); border-color: var(--acc-deep); }
  .sw input:checked + i::after { transform: translateX(14px); background: #fff; }
  .sw input:focus-visible + i { outline: 2px solid var(--acc); outline-offset: 1px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 13px 16px; }
  .kpi .k { font-size: 12px; color: var(--mut); }
  .kpi .v { font-size: 23px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .kpi .d { font-size: 11.5px; margin-top: 2px; color: var(--faint); }
  /* 存储页容量分布：两列自适应；每张小表带占比条 */
  .capgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px 20px; }
  .capgrid h4 { font-size: 12.5px; color: var(--mut); font-weight: 600; margin: 0 0 6px; }
  table.cap { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.cap td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.cap td.k { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.cap td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.cap td.b { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  table.cap td.bar { width: 78px; padding-right: 0; }
  table.cap td.bar i { display: block; height: 6px; min-width: 1px; border-radius: 3px; background: var(--acc); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 14px; }
  .card .hd { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .card .hd h3 { font-size: 13.5px; font-weight: 600; margin: 0; }
  .card .hd .sp { flex: 1; }
  .card .bd { padding: 14px 18px; }

  .toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 13px; }
  .toolbar .sp { flex: 1; }

  .tblwrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel); margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--faint); letter-spacing: .6px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clk { cursor: pointer; }
  th.sorth { cursor: pointer; user-select: none; }
  th.sorth:hover { color: var(--text); }
  th.sorth.on { color: var(--acc); }
  tr.grphead td { background: var(--panel2); color: #c9b6ff; font-weight: 600; font-size: 12.5px; }
  /* id/激活码等等宽值绝不逐字竖排；宽表随 .tblwrap 横向滚动 */
  td.mono, td .mono { white-space: nowrap; }
  td .sub { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
  .tfoot { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 12px; color: var(--mut); }
  .tfoot .sp { flex: 1; }

  .avatar { width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--acc-dim); color: #cfc8ff; }
  .ucell { display: flex; align-items: center; gap: 10px; }
  .modechips { display: flex; gap: 5px; }
  .mchip { font-size: 11px; border-radius: var(--r-sm); padding: 1px 7px; border: 1px solid var(--line2); color: var(--mut); cursor: pointer; user-select: none; white-space: nowrap; transition: border-color .12s; }
  .mchip:hover { border-color: var(--acc); }
  .mchip.on { color: var(--ok); border-color: rgba(65,211,146,.35); background: var(--ok-dim); }
  .mchip.off { color: var(--faint); text-decoration: line-through; }

  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 11px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span { font-size: 11.5px; color: var(--mut); }
  .fld.full { grid-column: 1 / -1; }

  /* ═══ 抽屉（用户详情）═══ */
  .scrim { position: fixed; inset: 0; background: rgba(5,6,10,.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 470px; max-width: 94vw; z-index: 41; background: var(--panel); border-left: 1px solid var(--line2); transform: translateX(102%); transition: transform .22s cubic-bezier(.3,.9,.3,1); display: flex; flex-direction: column; box-shadow: -18px 0 50px rgba(0,0,0,.4); }
  .drawer.on { transform: none; }
  .drawer .dh { display: flex; align-items: center; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
  .drawer .dh h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .drawer .db { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  .dsec { margin-bottom: 20px; }
  .dsec > .t { font-size: 11px; color: var(--faint); letter-spacing: 1.5px; margin-bottom: 8px; }
  .frow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .frow > label { width: 78px; flex: none; font-size: 12.5px; color: var(--mut); }
  .frow input[type=text], .frow input[type=number] { flex: 1; min-width: 0; }
  .frow .val { flex: 1; min-width: 0; }
  /* 抽屉窄，长激活码/机器码在此折行显示（表格里不折，此处覆盖 td.mono 规则不影响——抽屉不在 td 内） */
  .frow .val.mono { white-space: normal; word-break: break-all; }
  .swrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .swrow:last-child { border-bottom: none; }
  .swrow .nm { font-size: 13px; }
  .swrow .ds { font-size: 11.5px; color: var(--faint); }
  .swrow .sp { flex: 1; }
  .dangerzone { border: 1px solid rgba(242,109,141,.3); border-radius: var(--r-md); padding: 11px 14px; background: var(--bad-dim); display: flex; align-items: center; gap: 10px; }
  .dangerzone .tx { font-size: 12.5px; color: var(--mut); flex: 1; }

  /* ═══ 弹窗（原生 dialog 统一风格）═══ */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 14px; max-width: 900px; width: 92vw; padding: 0; box-shadow: 0 26px 70px rgba(0,0,0,.5); }
  dialog.wide { max-width: 1460px; }
  dialog.slim { max-width: 520px; }
  dialog::backdrop { background: rgba(5,6,10,.55); }
  dialog .mh { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  dialog .mh h2 { font-size: 15px; margin: 0; font-weight: 600; }
  dialog .mh .sp { flex: 1; }
  dialog .mb { padding: 16px 20px; max-height: 76vh; overflow: auto; }
  dialog .mf { display: flex; justify-content: flex-end; gap: 9px; padding: 13px 20px; border-top: 1px solid var(--line); }

  /* ═══ Toast ═══ */
  #toasts { position: fixed; right: 22px; bottom: 22px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
  .toast { display: flex; align-items: center; gap: 9px; background: var(--panel3); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 10px 15px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: tin .18s ease-out; max-width: 420px; }
  .toast.ok { border-color: rgba(65,211,146,.4); }
  .toast.ok::before { content: "✓"; color: var(--ok); font-weight: 700; }
  .toast.bad { border-color: rgba(242,109,141,.4); }
  .toast.bad::before { content: "✕"; color: var(--bad); font-weight: 700; }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } }

  /* ═══ 请求记录 ═══ */
  .filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 14px; margin-bottom: 13px; }
  .filterbar .div { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: none; padding: 5px 11px; font-size: 12px; color: var(--mut); }
  .seg button.on { background: var(--acc-dim); color: #cfc8ff; }
  .logtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
  .logtabs button { border: none; background: none; border-radius: 6px 6px 0 0; padding: 8px 14px; font-size: 12.5px; color: var(--mut); border-bottom: 2px solid transparent; }
  .logtabs button.on { color: var(--text); border-bottom-color: var(--acc); }
  .jsonbox { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow: auto; max-height: 52vh; position: relative; white-space: pre-wrap; word-break: break-all; }
  .copyfab { position: absolute; top: 8px; right: 8px; }
  /* 请求详情四栏：左列请求（①③）右列响应（②④） */
  .loggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .loggrid.two { grid-template-columns: 1fr 1fr; }
  .logcell { min-width: 0; }
  .logcell .lc-t { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); margin-bottom: 5px; }
  .logcell pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; max-height: 34vh; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 900px) { .loggrid { grid-template-columns: 1fr; } }
  .metagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .metagrid .k { font-size: 11px; color: var(--faint); }
  .metagrid .v { font-size: 13px; margin-top: 1px; word-break: break-all; }

  /* ═══ 提示词模板双栏（高度铺满视口，左右各自内部滚动）═══ */
  .tpl { display: grid; grid-template-columns: 300px 1fr; gap: 15px; align-items: stretch; height: calc(100vh - 116px); }
  @media (max-width: 1080px) { .tpl { grid-template-columns: 1fr; height: auto; } }
  .tpllist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .tpllist .lh { padding: 11px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex: none; }
  .tpllist .lh input { flex: 1; min-width: 0; }
  .tpllist .lbody { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
  .tpllist .grp { font-size: 11px; color: var(--faint); letter-spacing: 1px; padding: 12px 14px 4px; }
  .tpllist .it { padding: 7px 14px; cursor: pointer; border-left: 2px solid transparent; }
  .tpllist .it:hover { background: var(--panel2); }
  .tpllist .it.on { background: var(--acc-dim); border-left-color: var(--acc); }
  .tpllist .it.dis { opacity: .5; }
  .tpllist .it .nm { font-size: 13px; }
  .tpllist .it .id { font-size: 11px; color: var(--faint); font-family: var(--mono); }
  .tpled { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow-y: auto; min-height: 0; }
  .tpled .hd { position: sticky; top: 0; z-index: 2; background: var(--panel); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .bodyed { width: 100%; min-height: 52vh; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; resize: vertical; }
  .varchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .varchip { font-size: 11.5px; font-family: var(--mono); background: var(--panel3); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 2px 8px; color: #b9d4f2; }
  .imggrid { display: flex; flex-wrap: wrap; gap: 8px; }
  .imggrid .im { position: relative; }
  .imggrid img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line2); display: block; }
  .imggrid .im button { position: absolute; top: 3px; right: 3px; }

  /* ═══ 统计（纯文字，无图表）═══ */
  .statlists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 13px; margin-bottom: 16px; }
  .statlist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; }
  .statlist h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--mut); font-weight: 600; }
  .statlist .row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; font-size: 12.5px; border-top: 1px solid var(--line); }
  .statlist .row:first-of-type { border-top: none; }
  .statlist .row .lb { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statlist .row .vl { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--faint); flex: none; }
  .statlist .empty { font-size: 12px; color: var(--faint); padding: 4px 0; }

  /* ═══ 模式/家族卡片（第165轮：卡片式 + 拖动排序 + 启停）═══ */
  .mfgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(248px, 100%), 1fr)); gap: 10px; }
  /* ⚠ min-width:0 + minmax(0,1fr) 轨道缺一不可（第165轮补充5）：Chrome 对含 input 的卡片 min-content 算得很宽（~317px），
     1fr 隐含 minmax(auto,1fr) 会被它顶开 → 卡片撑破窄栏溢出；显式压平后名字长了在输入框内滚动，不撑版面 */
  .mfcard { min-width: 0; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 10px 12px 9px; display: flex; flex-direction: column; gap: 7px; transition: border-color .12s, opacity .12s, box-shadow .12s; }
  .mfcard:hover { border-color: #3a4360; box-shadow: 0 4px 16px rgba(0,0,0,.22); }
  .mfcard.dragging { opacity: .35; border-style: dashed; }
  .mfcard.off { opacity: .55; border-style: dashed; }
  .mfcard .top { display: flex; align-items: center; gap: 7px; }
  .mfcard .grip { flex: none; cursor: grab; color: var(--faint); user-select: none; font-size: 13px; line-height: 1; padding: 5px 4px; border-radius: 5px; }
  .mfcard .grip:hover { color: var(--text); background: var(--panel3); }
  .mfcard .grip:active { cursor: grabbing; }
  .mfcard .top input { flex: 1; min-width: 0; font-weight: 600; background: transparent; }
  .mfcard .top input:hover, .mfcard .top input:focus { background: var(--bg); }
  .mfcard .meta { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--faint); flex-wrap: wrap; min-height: 20px; }
  .mfcard .meta .cnt { color: var(--mut); font-variant-numeric: tabular-nums; }
  .mfcard .ft { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 7px; margin-top: 1px; }
  .mfcard .ord { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .mfcard .offbadge { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid rgba(255,167,88,.45); color: #ffb877; }
  .mfgrid.wide { grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
  .mfcard .frow { display: flex; align-items: center; gap: 7px; }
  .mfcard .frow > span { flex: none; width: 28px; font-size: 11.5px; color: var(--faint); }
  .mfcard .frow input, .mfcard .frow select { flex: 1; min-width: 0; }
  /* 新增占位卡：点击展开成空白草稿卡填写（第165轮补充） */
  .mfcard.ghostcard { border-style: dashed; align-items: center; justify-content: center; cursor: pointer; color: var(--faint); gap: 4px; min-height: 96px; }
  .mfcard.ghostcard:hover { color: var(--text); border-color: rgba(139,124,247,.55); box-shadow: none; }
  .mfcard.ghostcard .plus { font-size: 22px; line-height: 1; }
  .mfcard.ghostcard .glabel { font-size: 12px; }
  .mfcard.draft { border-color: rgba(139,124,247,.5); }
  .mfcard.draft:hover { border-color: rgba(139,124,247,.7); }
  /* 模型卡片（第166轮：模型管理卡片式）*/
  .mfcard .mname { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mfcard .mtag { flex: none; font-size: 11px; border: 1px solid var(--line2); border-radius: 999px; padding: 1px 8px; color: var(--mut); white-space: nowrap; }
  .mgrph { margin: 16px 0 8px; font-weight: 600; font-size: 12.5px; color: #c9b6ff; }
  #m_body .mgrph:first-child { margin-top: 4px; }
  /* 渠道页三栏布局（第165轮补充3/4）：渠道 | 模式（单竖列） | 家族（图片/视频 两竖列）——竖列单列排布方便拖动排序 */
  .chpage { display: grid; grid-template-columns: minmax(340px, 2.3fr) minmax(240px, .6fr) minmax(430px, 1.3fr); gap: 14px; align-items: start; }
  @media (max-width: 1560px) { .chpage { grid-template-columns: 1fr; } }
  .mfcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: start; }
  .mfcol-h { font-size: 11.5px; color: var(--faint); letter-spacing: .6px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
  .mfcol-h .cntb { color: var(--mut); font-variant-numeric: tabular-nums; }
  .mfcol .mfgrid { grid-template-columns: minmax(0, 1fr); }

  /* ═══ 登录 ═══ */
  #login { min-height: 100vh; display: grid; place-items: center; }
  #login .box { width: 380px; max-width: 92vw; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px 30px 26px; }
  #login .lg { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  #login .lg img.biglogo { height: 56px; display: block; }
  #login h2 { margin: 0; font-size: 17px; }
</style>
</head>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 用户名展示：注册时可不填昵称；空则占位 */
const dispName = (u) => (u && u.name && u.name.trim()) ? u.name : "（未注册）";
let TOKEN = localStorage.getItem("qiji_admin_token") || "";

async function api(path, opts={}) {
  // 只在有 body 时带 Content-Type：无 body 的 POST（重置密钥/OSS 测试）带 application/json 会被 Fastify 以空 JSON 拒掉（400）
  const headers = { Authorization: "Bearer " + TOKEN, ...(opts.body!=null ? {"Content-Type":"application/json"} : {}), ...(opts.headers||{}) };
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) { logout(); throw new Error("令牌无效"); }
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e?.error?.message || ("HTTP " + r.status)); }
  return r.status === 204 ? null : r.json();
}

/* ── Toast（替代 alert）── */
function toast(msg, kind="ok"){
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; }, 2600);
  setTimeout(()=>t.remove(), 3000);
}
/* ── 确认弹窗（替代 confirm）── */
function confirmDo({ title, text, okLabel="确认", danger=true, onOk }){
  $("#cfmTitle").textContent = title;
  $("#cfmTitle").style.color = danger ? "var(--bad)" : "";
  $("#cfmBody").innerHTML = text;
  const ok = $("#cfmOk");
  ok.className = danger ? "danger" : "pri";
  ok.textContent = okLabel;
  ok.onclick = () => { cfm.close(); onOk(); };
  cfm.showModal();
}
function copyText(s, msg){ navigator.clipboard.writeText(s); toast(msg || "已复制"); }

/* ── 登录 ── */
function showLogin(){ $("#login").classList.remove("hide"); $("#app").classList.add("hide"); }
function showApp(){ $("#login").classList.add("hide"); $("#app").classList.remove("hide"); checkHealth(); applyRelayMode(); switchTab("users"); }

/* ── P3 渠道节点（relay）模式：隐藏源站专属页 + 顶部「源站连接」状态条 ──
   角色由服务端注入 window.__NODE_ROLE__；源站专属端点在服务端也已 403（这里只是观感收敛）。 */
const IS_RELAY = window.__NODE_ROLE__ === "relay";
const RELAY_HIDE_TABS = ["quota","channels","models","templates","presets","agents","oss"];
function applyRelayMode(){
  if (!IS_RELAY) return;
  RELAY_HIDE_TABS.forEach(t => { const a = document.querySelector(`.nav a[data-tab="${t}"]`); if (a) a.style.display = "none"; });
  // 组标签下若已无可见页签则一并隐藏
  document.querySelectorAll(".nav .grp").forEach(g => {
    let el = g.nextElementSibling, any = false;
    while (el && !el.classList.contains("grp")) { if (el.tagName === "A" && el.style.display !== "none") any = true; el = el.nextElementSibling; }
    if (!any) g.style.display = "none";
  });
  const brand = document.querySelector(".me");
  if (brand) brand.insertAdjacentHTML("beforebegin", `<div style="padding:8px 14px;font-size:11px;color:var(--faint)">渠道节点（relay）</div>`);
  if (!document.getElementById("relayBar")) {
    document.querySelector(".main .top").insertAdjacentHTML("afterend", `<div id="relayBar" style="margin:10px 18px 0;padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel2);font-size:12.5px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"></div>`);
  }
  refreshRelayBar();
}
async function refreshRelayBar(){
  const bar = document.getElementById("relayBar");
  if (!bar) return;
  try {
    const s = await api("/admin-api/relay/status");
    bar.innerHTML = s.ok
      ? `<b style="color:var(--acc)">源站连接</b>
         <span>地址 <span class="mono">${esc(s.sourceUrl)}</span></span>
         <span>身份 <b>${esc(s.agent?.name||"—")}</b></span>
         <span>积分池 <b>${(s.agent?.credits||0).toLocaleString()}</b></span>
         <span>在途任务 <b>${s.pendingTasks||0}</b></span>
         ${s.catalogVersion?`<span class="faint">目录 ${esc(s.catalogVersion)}</span>`:""}
         <span class="badge ok">已连通</span>
         <span class="sp"></span><button class="sm ghost" onclick="refreshRelayBar()">刷新</button>`
      : `<b style="color:var(--acc)">源站连接</b>
         <span>地址 <span class="mono">${esc(s.sourceUrl||"未配置")}</span></span>
         <span class="badge bad">未连通</span><span class="faint">${esc(s.error||"")}</span>
         <span class="sp"></span><button class="sm ghost" onclick="refreshRelayBar()">刷新</button>`;
  } catch(e){ bar.innerHTML = `<span class="faint">源站状态获取失败：${esc(e.message)}</span>`; }
}
async function doLogin(){
  TOKEN = $("#tok").value.trim();
  try { await api("/admin-api/users"); localStorage.setItem("qiji_admin_token", TOKEN); showApp(); }
  catch(e){ $("#loginErr").textContent = e.message; $("#loginErr").classList.remove("hide"); }
}
function logout(){ localStorage.removeItem("qiji_admin_token"); TOKEN=""; showLogin(); }
async function checkHealth(){
  try { const r = await fetch("/health"); $("#hdot").className = "dot " + (r.ok?"ok":"bad"); $("#htext").textContent = r.ok?"服务正常":"服务异常"; }
  catch { $("#hdot").className = "dot bad"; $("#htext").textContent = "无法连接"; }
}

/* ── 页签 ── */
/* ════ 渠道商范围（第175轮）：源站各页统一的「按渠道商查看」下拉 ════
   三态值恒定：`__all`=全部 / `platform`=源站 / `<agentId>`=某渠道商——各页只是**缺省**不同：
   · 运营口径页（用户/兑换码/统计/请求记录）缺省 platform（源站视为一个渠道商，自己的账先分清）；
   · 资源清单页（团队/共享素材/模型/提示词模板）缺省 __all（这些页原本就是全量视图，加筛选不改口径）。
   渠道商清单一次拉取全页共用（SCOPE_AGENTS），刷新按钮置空即可重拉。 */
let SCOPE_AGENTS = null;
async function ensureScopeAgents(){ if(!SCOPE_AGENTS){ try{ SCOPE_AGENTS=(await api("/admin-api/agents")).items||[]; }catch{ SCOPE_AGENTS=[]; } } return SCOPE_AGENTS; }
function scopeSelect(id, cur, onchange, title){
  return `<select id="${id}" onchange="${onchange}(this.value)" style="max-width:210px" title="${esc(title||"按渠道商查看")}">
    <option value="__all" ${cur==="__all"?"selected":""}>全部（源站 + 各渠道商）</option>

function relTime(t){
  if (!t) return "";
  const d = Date.now() - new Date(t).getTime();
  if (d < 60e3) return "刚刚";
  if (d < 3600e3) return Math.floor(d/60e3) + " 分钟前";
  if (d < 86400e3) return Math.floor(d/3600e3) + " 小时前";

}

async function toggleFeat(id, k){

  const f = Object.assign({assetMode:true,canvasMode:true,editorMode:true,libtv:true,dreamina:true}, u.features||{});

  if (f.assetMode===false && f.canvasMode===false && f.editorMode===false){ toast("资产、画布与实时剪辑模式至少保留一个", "bad"); return; }

    await api("/admin-api/users/"+id, { method:"PUT", body: JSON.stringify({ features: f }) });

/* 通用：二维数组 → CSV 下载（带 BOM 防 Excel 中文乱码） */
function downloadCsv(rows, baseName){
  const csv = "﻿" + rows.map(r=>r.map(c=>{const s=String(c??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\r\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = baseName+"-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"")+".csv";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

  const custom = (window.__customProtocols||[]).filter(p=>p.enabled).map(p=>p.id);

function modelsInMode(id){ return (window.__models||[]).filter(m=>m.modeId===id).length; }
/* 卡片底部模型数按能力细分（第165轮补充6）：如「2文本/3图像/2视频」；无模型=「0 个模型」 */
const CAP_LABELS = { text:"文本", image:"图像", video:"视频", audio:"音频", "video-enhance":"超分", "video-erase":"去字幕", "image-enhance":"图超分" };
const CAP_ORDER = ["text","image","video","audio","video-enhance","video-erase","image-enhance"];
function capBreakdown(pred){
  const by = {};
  (window.__models||[]).forEach(m=>{ if(pred(m)) by[m.capability]=(by[m.capability]||0)+1; });
  const parts = CAP_ORDER.filter(c=>by[c]).map(c=>by[c]+CAP_LABELS[c]);
  Object.keys(by).filter(c=>!CAP_ORDER.includes(c)).forEach(c=>parts.push(by[c]+c)); // 未知能力兜底按原名
  return parts.length ? parts.join("/") : "0 个模型";
}
/* 通用卡片拖动排序：只有按住 ⠿ 才可拖（避免劫持输入框选字）；dragover 实时把被拖卡插到落点预览，
   dragend 按 DOM 顺序提交。⚠ 拖动期间绝不重渲染网格（HTML5 DnD 里重建被拖元素会当场取消拖动）。 */
function wireMfSort(gridId, onCommit){
  const grid = document.getElementById(gridId); if(!grid) return;
  let dragEl = null, startOrder = "";
  const gridIds = ()=>[...grid.querySelectorAll(".mfcard")].map(c=>c.dataset.id).filter(Boolean); // 占位/草稿卡无 data-id → 过滤
  grid.addEventListener("dragover", e=>{ if(dragEl) e.preventDefault(); });
  grid.querySelectorAll(".mfcard").forEach(card=>{
    const grip = card.querySelector(".grip"); if(!grip) return;
    grip.addEventListener("mousedown", ()=>{ card.draggable = true; });
    card.addEventListener("dragstart", e=>{
      dragEl = card; card.classList.add("dragging"); startOrder = gridIds().join();
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", card.dataset.id); }catch{}
    });
    card.addEventListener("dragend", ()=>{
      card.draggable = false; card.classList.remove("dragging");
      if(!dragEl) return; dragEl = null;
      const ids = gridIds();
      if(ids.join() !== startOrder) onCommit(ids); // 顺序没变（拖了没挪/拖出网格）不提交
    });
    card.addEventListener("dragover", e=>{
      if(!dragEl || dragEl===card) return;
      e.preventDefault();
      const r = card.getBoundingClientRect();
      const after = (e.clientX - r.left) / r.width > .5; // 网格横向流式：按落点在卡片左/右半区决定插前/插后
      grid.insertBefore(dragEl, after ? card.nextSibling : card);
    });
  });
}

/* 模型开放范围（第110轮受众制 → 第167轮改按**渠道商分组**）：未开放的受众 catalog 不下发、调用被 403。

/* 开放范围（第167轮·用户两轮定稿「不要二级界面、菜单仅分组」）：卡面按钮=状态文本，点开**纯分组勾选**菜单，

   部分勾=按分组开放（受众——渠道商/源站——的**生效分组**命中即开放，链上任一受众命中同旧语义）。

let SHARE_POP = null, SHARE_GROUPS = [];

}
function shareOutside(e){ if (SHARE_POP && !SHARE_POP.contains(e.target)) closeShareMenu(); }
async function openShareMenu(id, btn){
  closeShareMenu();
  let gd = { items: [] };
  try { gd = await api("/admin-api/agent-groups"); } catch {}
  const groups = gd.items||[];
  const host = (typeof dlg !== "undefined" && dlg.open) ? dlg : document.body;
  const r = btn.getBoundingClientRect();

  host.appendChild(pop);

  const render = () => {
    const m = (window.__models||[]).find(x=>x.id===id); if(!m){ closeShareMenu(); return; }

    // 勾选态：all=全勾；select=按清单；none/旧清单=全不勾

      ${groups.map(g=>`<label style="display:flex;gap:6px;align-items:center;padding:3px 6px;font-size:12.5px;cursor:pointer;border-radius:6px" onmouseover="this.style.background='var(--panel3)'" onmouseout="this.style.background=''"><input type="checkbox" ${on(g)?'checked':''} onchange="toggleShareGroup('${id}','${g.id}',this.checked)"/>${esc(g.name)} <span class="faint" style="font-size:11px">（${g.memberCount} 成员${g.platformIn?'·含源站':''}）</span></label>`).join("") || `<div class="faint" style="font-size:12px;padding:2px 6px">暂无分组（在「渠道商 → 分组管理」创建）</div>`}
      ${s==='none'?`<div class="bad-t" style="font-size:11px;margin-top:5px;padding:0 6px">当前不开放：所有用户都看不到该模型</div>`:''}

async function shareSave(id, patch){
  try {
    await api("/admin-api/models/"+id,{method:"PUT",body:JSON.stringify(patch)});
    const m=(window.__models||[]).find(x=>x.id===id);
    if(m) Object.assign(m, { shareScope: patch.shareScope, shareGroupIds: patch.shareGroupIds&&patch.shareGroupIds.length?patch.shareGroupIds:undefined, shareAgentIds: undefined });
    toast("开放范围已保存（目录热更下发）");
    renderModels();
    if (SHARE_POP && SHARE_POP._render) SHARE_POP._render();
  } catch(e){ toast(e.message,"bad"); }
}
/* 勾选归一（第167轮定稿）：全勾 → 存 'all'（自动含以后新建的分组）；全不勾 → 'none'；部分勾 → select+清单 */
function toggleShareGroup(id, gid, on){
  const m=(window.__models||[]).find(x=>x.id===id); if(!m) return;
  const s=m.shareScope||"all";
  const cur=new Set(s==='all' ? SHARE_GROUPS.map(g=>g.id) : s==='select' ? (m.shareGroupIds||[]) : []);
  if(on) cur.add(gid); else cur.delete(gid);
  const allIds=SHARE_GROUPS.map(g=>g.id);
  const patch = cur.size===0
    ? { shareScope:'none', shareGroupIds:[], shareAgentIds:[] }
    : (allIds.length && allIds.every(x=>cur.has(x)))
      ? { shareScope:'all', shareGroupIds:[], shareAgentIds:[] }
      : { shareScope:'select', shareGroupIds:[...cur], shareAgentIds:[] };
  shareSave(id, patch);
}
function renderModels(){
  if(!$("#m_body")) return; // 模式增删改也会调它刷新分组——「渠道」页（模式管理所在页）无模型表，跳过
  const all = window.__models||[];

  const nOn = all.filter(m=>m.enabled).length;
  const tb = $("#m_toolbar");
  if(tb) tb.innerHTML = `${scopeSelect("m_scope", mScope, "setModelScope", "按可用性查看：某渠道商实际能用的模型（开放范围命中 且 未被其链上任一级禁用）")}
    <span class="faint" style="margin-left:10px">${mScope==="__all" ? "全部模型" : (mScope==="platform" ? "源站（平台直属用户）可用" : esc(scopeName(mScope))+" 可用")}</span>
    <span class="faint" style="margin-left:14px">分组：</span>
    <span class="chip ${mGroup==='channel'?'on':''}" onclick="mGroup='channel';renderModels()">按渠道</span>
    <span class="chip ${mGroup==='mode'?'on':''}" onclick="mGroup='mode';renderModels()">按模式</span>
    <span class="chip ${mGroup==='family'?'on':''}" onclick="mGroup='family';renderModels()">按家族</span>
    <span class="faint" style="margin-left:14px">状态：</span>
    <span class="chip ${mChip==='on'?'on':''}" onclick="mChip='on';renderModels()">启用 ${nOn}</span>
    <span class="chip ${mChip==='off'?'on':''}" onclick="mChip='off';renderModels()">已禁用 ${all.length-nOn}</span>
    <span class="chip ${mChip==='all'?'on':''}" onclick="mChip='all';renderModels()">全部 ${all.length}</span>`;
  const items = mChip==='all' ? all : all.filter(m=> mChip==='off' ? !m.enabled : m.enabled);
  const keyOf = mGroup==='mode' ? (m)=>(m.modeId||"") : mGroup==='family' ? (m)=>(m.familyId||"") : (m)=>(m.channelId||"");
  const nameOf = mGroup==='mode' ? (k)=>(k?modeNameA(k):"默认模式（常开）") : mGroup==='family' ? (k)=>famNameA(k) : (k)=>channelName(k);
  const groups = {};
  items.forEach(m=>{ const k = keyOf(m); (groups[k]=groups[k]||[]).push(m); });
  // 组内顺序（第176轮）：与 catalog 下发同一把尺——模型 order（管理端拖动）→ 原始加入序（稳定、未排序过的库不变）
  const addIdx = new Map(all.map((m,i)=>[m.id,i]));
  const MAXI = Number.MAX_SAFE_INTEGER;
  Object.values(groups).forEach(a=>a.sort((x,y)=>((x.order??MAXI)-(y.order??MAXI)) || (addIdx.get(x.id)-addIdx.get(y.id))));
  // 按渠道分组时跟随渠道现有排序（CHANNELS 已按 order 排好；找不到的排在最后）；其余维度按显示名
  const chIdx = (k)=>{ const i = CHANNELS.findIndex(c=>c.id===k); return i<0 ? Number.MAX_SAFE_INTEGER : i; };
  const cmp = mGroup==='channel' ? (a,b)=>(chIdx(a)-chIdx(b)) || nameOf(a).localeCompare(nameOf(b)) : (a,b)=>nameOf(a).localeCompare(nameOf(b));

    const head = `<div class="mgrph">▍ ${esc(nameOf(k))} <span class="faint" style="font-weight:400">（${groups[k].length} 个模型 · 按住 ⠿ 可在组内拖动排序）</span></div>`;
    return head + `<div class="mfgrid wide" id="m_grid_${gi}">${groups[k].map(modelCard).join("")}</div>`;
  }).join("") || `<div class="faint" style="text-align:center;padding:18px 0">${mChip==='off'?'没有已禁用的模型':'该筛选下暂无模型'}</div>`;
  // 组内拖动排序（第176轮）：只提交**本组这批**的 id（其余模型 order 不动，见 store/models.ts reorderModels 注释）
  keys.forEach((k,gi)=>wireMfSort(`m_grid_${gi}`, saveModelOrder));
}

/* 左列表：按用途分组（不按时间）——固定用途序 → 未知用途 → 无用途（画风等预设）；组内按 order → 名称 */
function tplGroups(){
  const q = tplSearch.trim().toLowerCase();
  let items = TPLS;
  if (q) items = items.filter(t=>[t.id,t.name,t.purpose,purposeLabel(t.purpose||""),t.category].some(x=>String(x||"").toLowerCase().includes(q)));
  const by = {};
  items.forEach(t=>{ const k=t.purpose||""; (by[k]=by[k]||[]).push(t); });
  Object.values(by).forEach(a=>a.sort((x,y)=>(x.order||0)-(y.order||0) || String(x.name).localeCompare(String(y.name))));
  const known = PURPOSES.filter(p=>by[p]);
  const unknown = Object.keys(by).filter(k=>k && !PURPOSES.includes(k)).sort();
  const groups = [];
  known.forEach(p=>groups.push({ key:p, label:`${purposeLabel(p)} · ${p}`, items:by[p] }));
  unknown.forEach(p=>groups.push({ key:p, label:`${purposeLabel(p)} · ${p}`, items:by[p] }));
  if (by[""]) groups.push({ key:"", label:"无用途", items:by[""] });
  return groups;
}

  const host = $("#tpl_list"); if(!host) return;

/* 模板开放范围控件（第176轮，用户定「和模型一样直接展示渠道分组按键、按亮灭启用禁止」）：
   直接平铺**渠道商分组**按键（源站也归属某个分组，见 agents.ts audienceGroupId），无「全部/不开放」两项——
   全亮=全部受众（存 shareScope:'all'，自动含以后新建的分组）、全灭=不开放（'none'）、部分亮=select+分组清单。
   ⚠ 与模型侧（点选即存）不同：这里在**模板编辑器**里，与其它字段一起点右上「保存」才生效。 */
function initTplShare(t){
  const s = t.shareScope || "all";
  const allIds = TPL_GROUPS.map(g=>g.id);
  TE_LEGACY = (t.shareAgentIds||[]).slice();
  TE_GROUPS = s==="all" ? allIds.slice() : s==="select" ? (t.shareGroupIds||[]).slice() : [];
  TE_GROUPS_TOUCHED = false;
}
function tplGroupChips(){
  if (!TPL_GROUPS.length) return `<span class="faint" style="font-size:12px">暂无分组（在「渠道商 → 分组管理」创建）</span>`;
  return TPL_GROUPS.map(g=>{
    const on = TE_GROUPS.includes(g.id);
    return `<button type="button" class="${on?'pri':''} sm" style="${on?'':'opacity:.55'}" onclick="toggleTplGroup('${g.id}')" title="${esc(g.name)}：${g.memberCount} 个受众${g.platformIn?'（含源站）':''}">${on?'●':'○'} ${esc(g.name)}<span class="faint" style="font-size:11px"> ${g.memberCount}${g.platformIn?'·源站':''}</span></button>`;
  }).join("");
}
function tplShareHint(){
  const n = TE_GROUPS.length, all = TPL_GROUPS.length;
  const legacy = (!TE_GROUPS_TOUCHED && !n && TE_LEGACY.length)
    ? `　⚠ 仍按旧「指定受众」清单生效（${TE_LEGACY.length} 个）——点亮任一分组后由分组制替换` : "";
  if (all && n === all) return "全部受众（源站直属用户 + 所有渠道商的用户）都能用此模板；以后新建的分组自动包含。" + legacy;
  if (!n) return "不开放给任何人（源站直属用户也不可用）。" + legacy;
  return `已开放给 ${n}/${all} 个分组：${TE_GROUPS.map(id=>TPL_GROUPS.find(g=>g.id===id)?.name||id).join(" / ")}。` + legacy;
}
function toggleTplGroup(gid){
  TE_GROUPS_TOUCHED = true;
  TE_GROUPS = TE_GROUPS.includes(gid) ? TE_GROUPS.filter(x=>x!==gid) : [...TE_GROUPS, gid];
  const box = $("#te_share_groups"); if(box) box.innerHTML = tplGroupChips();
  const h = $("#te_share_hint"); if(h) h.textContent = tplShareHint();
}
/* 保存时的归一（与模型侧 toggleShareGroup 同一套语义）：全亮→'all'、全灭→'none'、部分→select+分组清单；
   未动过按键且存量是旧受众清单 → 返回 null=**不带开放范围字段**，绝不把存量语义抹成 none。 */
function tplSharePatch(){
  if (!TE_GROUPS_TOUCHED && !TE_GROUPS.length && TE_LEGACY.length) return null;
  const allIds = TPL_GROUPS.map(g=>g.id);
  if (!TE_GROUPS.length) return { shareScope:"none", shareGroupIds:[], shareAgentIds:[] };
  if (allIds.length && allIds.every(id=>TE_GROUPS.includes(id))) return { shareScope:"all", shareGroupIds:[], shareAgentIds:[] };
  return { shareScope:"select", shareGroupIds:TE_GROUPS.slice(), shareAgentIds:[] };
}
async function saveTpl(id){
  if (isAgentScope(tplScope)) { toast("渠道商自营模板只读，不能在源站修改","bad"); return; }
  const t = TPLS.find(x=>x.id===id); if(!t) return;
  const patch = {
    name: $("#te_name").value.trim() || id,
    category: $("#te_cat").value.trim() || null,
    capability: $("#te_cap").value,
    purpose: $("#te_purpose").value || null,
    schemaId: $("#te_schema").value.trim() || null,
    nodeTypes: parseList($("#te_nodes").value),
    variables: parseList($("#te_vars").value),
    chainNextId: $("#te_chain").value.trim() || null,
    chainPipeVar: $("#te_pipe").value.trim() || undefined, // 服务端无清空语义，留空=不变（与旧版一致）
    order: Number($("#te_order").value) || 0,
    isDefault: $("#te_default").checked,
    enabled: $("#te_enabled").checked,
    body: $("#te_body").value,
    ...(tplSharePatch() || {}),
  };
  try {
    await api("/admin-api/templates/"+id,{method:"PUT",body:JSON.stringify(patch)});
    Object.assign(t, patch, { category:patch.category||undefined, purpose:patch.purpose||undefined, schemaId:patch.schemaId||undefined, chainNextId:patch.chainNextId||undefined });
    const s = $("#t_save"); if(s){ s.textContent = "已保存 ✓"; setTimeout(()=>{ if(s.isConnected) s.textContent=""; },1800); }
    toast("模板已保存，catalog 版本 +1 热更下发");
    renderTplList(); renderTplEditor();
  } catch(e){ toast(e.message,"bad"); }
}

function compressImage(file, maxSize=512){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h&&w>maxSize){h=Math.round(h*maxSize/w);w=maxSize;}
      else if(h>w&&h>maxSize){w=Math.round(w*maxSize/h);h=maxSize;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/webp",0.85));
    }; img.onerror=reject; img.src=r.result; };
    r.onerror=reject; r.readAsDataURL(file);
  });
}

/* 左列表：按分组归档（画风 → 预设方案 → 其它自由分组）；组内按 order → 名称 */
function presetGroupsList(){
  const q = preSearch.trim().toLowerCase();
  let items = PRESETS;
  if (q) items = items.filter(p=>[p.id,p.name,p.category,p.group].some(x=>String(x||"").toLowerCase().includes(q)));
  const by = {};
  items.forEach(p=>{ const k=p.category||"未分组"; (by[k]=by[k]||[]).push(p); });
  Object.values(by).forEach(a=>a.sort((x,y)=>(x.order||0)-(y.order||0) || String(x.name).localeCompare(String(y.name))));
  const known = PRESET_CATS.filter(c=>by[c]);
  const rest = Object.keys(by).filter(k=>!PRESET_CATS.includes(k)).sort();
  return [...known, ...rest].map(k=>({ key:k, label:k, items:by[k] }));
}
function presetAttachHint(p){
  const a = p.autoAttach||[];

  return `拆分自动附加：${names} · ${p.position==="suffix"?"后缀":"前缀"}`;

async function genRedeem(){
  const credits = Number($("#rd_credits").value)||0;
  const count = Number($("#rd_count").value)||1;
  const exp = $("#rd_exp").value;
  const expiresAt = exp ? new Date(exp+"T23:59:59").toISOString() : undefined;
  const note = $("#rd_note").value.trim()||undefined;
  if (credits<=0){ $("#rd_err").textContent = "面额需 > 0"; return; }
  try {
    const r = await api("/admin-api/redeem-codes",{method:"POST",body:JSON.stringify({credits,count,expiresAt,note})});
    const items = r.items||[];
    $("#dlgTitle").textContent = "已生成 " + items.length + " 个兑换码";
    $("#dlgBody").innerHTML = `

      <pre class="jsonbox" style="max-height:46vh">${esc(items.map(c=>c.code).join("\n"))}</pre>`;
    window.__newRd = items.map(c=>c.code);
    dlg.classList.remove("wide"); dlg.showModal();
    loadRedeem();
  } catch(e){ $("#rd_err").textContent = e.message; }
}
function copyUnusedCodes(){
  const list = (window.__codes||[]).filter(c=>!c.used && !(c.expiresAt && Date.now()>Date.parse(c.expiresAt))).map(c=>c.code);
  if (!list.length){ toast("没有可用的未使用兑换码","bad"); return; }
  copyText(list.join("\n"), "已复制 "+list.length+" 个未使用兑换码");
}
function delRedeem(code){
  confirmDo({ title:"删除兑换码", text:`删除兑换码「<span class="mono">${esc(code)}</span>」？`, okLabel:"删除", onOk: async ()=>{
    try { await api("/admin-api/redeem-codes/"+encodeURIComponent(code),{method:"DELETE"}); toast("已删除"); loadRedeem(); } catch(e){ toast(e.message,"bad"); }
  }});
}
function pruneRedeem(){

    try {
      const r = await api("/admin-api/redeem-codes/prune",{method:"POST",body:"{}"});
      toast(r.removed ? `已清除 ${r.removed} 个（已使用 ${r.usedRemoved} / 已过期 ${r.expiredRemoved}）${r.refunded?`，退回渠道商 ${r.refunded.toLocaleString()} 积分`:""}` : "没有失效的兑换码");

    } catch(e){ toast(e.message,"bad"); }
  }});
}

  const a = window.__cdAgent, add = window.__cdAdd;

  const f = Object.assign({assetMode:true,canvasMode:true,editorMode:true,libtv:true,dreamina:true}, a.features||{});
  f[key] = (on===true || on==="true");
  try { await api("/admin-api/agents/"+id,{method:"PUT",body:JSON.stringify({ features: f })}); toast("已更新可用模式（其用户心跳 ≤30s 生效）");

  catch(e){ toast(e.message,"bad"); }

  catch(e){ toast(e.message,"bad"); }
}

  return Object.keys(groups).sort((a,b)=> a===""?-1 : b===""?1 : groups[a].name.localeCompare(groups[b].name)).map(k=>groups[k]);

async function toggleAgentModelAccess(mid, blocked){
  const m = AGP_ITEMS.find(x=>x.id===mid); if(!m) return;
  const wantBlock = (blocked===true || blocked==="true");
  const doIt = async ()=>{
    try {
      await api("/admin-api/agents/"+AGP_AID+"/models/"+encodeURIComponent(mid)+"/access",{ method:"PUT", body: JSON.stringify({ blocked: wantBlock }) });
      m.blocked = wantBlock;
      toast(wantBlock?"已禁用：其用户的模型下拉将随目录热更移除，调用被拒":"已解除禁用，其用户目录热更后恢复可用");
      renderAgentPricing();
    } catch(e){ toast(e.message,"bad"); }
  };
  if (wantBlock) confirmDo({ title:"禁用模型", text:`禁止该渠道商使用「<b>${esc(m.label)}</b>」？其名下<b>全部用户</b>将无法选择/调用此模型（客户端目录热更后自动移除；已在途任务不受影响）。`, okLabel:"禁用", danger:true, onOk: doIt });
  else doIt();
}

function dayStartMs(t){ const x=new Date(t); x.setHours(0,0,0,0); return x.getTime(); }
function computeRange(key){
  const now = Date.now(), today = dayStartMs(now), DAY = 86400000;
  if (key==="today") return {from:today, to:now};
  if (key==="yesterday") return {from:today-DAY, to:today};
  if (key==="2ago") return {from:today-2*DAY, to:today-DAY};      // 前天
  if (key==="3d") return {from:today-2*DAY, to:now};
  if (key==="7d") return {from:today-6*DAY, to:now};
  if (key==="30d") return {from:today-29*DAY, to:now};
  return {from:undefined, to:undefined};
}

/* 浏览器直下：先 fetch 成 blob 再存（能带上文件名），跨域被拒时回退新窗口打开。
   仅适合小批量——大批量走独立下载器。 */
const DL_BROWSER_MAX = 50;
async function browserDownloadAll(){
  if (!dlManifest || !dlManifest.total){ toast("该筛选条件下暂无产物","bad"); return; }
  const all = dlManifest.items.filter(i=>!i.authRequired);
  const skipped = dlManifest.total - all.length;
  const batch = all.slice(0, DL_BROWSER_MAX);
  if (!batch.length){ toast("可直连的产物为 0（全部需服务端代下）","bad"); return; }
  confirmDo({
    title:"在浏览器里下载",
    text:`将依次下载 <b>${batch.length}</b> 个文件${all.length>batch.length?`（共 ${all.length} 个可直连，本次只下前 ${DL_BROWSER_MAX} 个）`:""}${skipped?`，另有 <b>${skipped}</b> 个需服务端代下已跳过`:""}。<br>浏览器会逐个弹下载，<b>不会自动分目录</b>；大批量请用「导出清单 JSON」+ 独立下载器。`,
    okLabel:"开始下载",
    onOk: async ()=>{
      let done=0, failed=0;
      for (const it of batch){
        $("#d_selinfo").textContent = `下载中 ${done+failed+1}/${batch.length}…`;
        try {
          const r = await fetch(it.url, { mode:"cors" });
          if (!r.ok) throw new Error("HTTP "+r.status);
          const b = await r.blob();
          const a = document.createElement("a"); a.href = URL.createObjectURL(b);
          a.download = it.suggestedPath.split("/").pop();
          a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
          done++;
        } catch {
          // 跨域没开 CORS 的上游 CDN：退回新窗口打开（浏览器自己决定是下载还是预览）
          window.open(it.url, "_blank", "noopener");
          failed++;
        }
        await new Promise(res=>setTimeout(res, 220)); // 别把浏览器下载队列打爆
      }
      $("#d_selinfo").textContent = `完成：直接保存 ${done} 个${failed?`，另有 ${failed} 个跨域受限已改为新窗口打开`:""}`;
      toast(`下载完成（${done} 个已保存${failed?`，${failed} 个转新窗口`:""}）`);
    },
  });
}
/* 详情：四段报文（① 用户→管理端 ② 管理端→用户 ③ 管理端→上游 ④ 上游→管理端）。
   backAgentId：从「渠道商详情 → 请求记录」进来时给出，详情顶部出现返回按钮。 */
async function showLog(id, backAgentId, backUser){
  const l = await api("/admin-api/logs/"+id);
  const prunedTxt = "（详情报文已按保留策略清除：超过 3 天的记录仅保留请求记录本身）";
  window.__logSegs = l.detailPruned ? { s1: prunedTxt, s2: prunedTxt, s3: prunedTxt, s4: prunedTxt } : {
    s1: JSON.stringify({ headers:l.requestHeaders, body:l.request }, null, 2),
    s2: JSON.stringify(l.response, null, 2),
    s3: l.upstreamRequest!==undefined ? JSON.stringify(l.upstreamRequest, null, 2) : "（无：echo/stub 或上游未发起）",
    s4: l.upstreamResponse!==undefined ? JSON.stringify(l.upstreamResponse, null, 2) : "（无）",
  };
  const meta = [["用户",esc(l.userName||"—")],["步骤",esc(purposeLabel(l.purpose))],["模型",`<span class="mono">${esc(l.model||"—")}</span>`],
    ["用户扣费",l.cost!=null?l.cost+" 积分":"—"],["请求时间",fmtTime(l.startedAt)],["完成时间",fmtTime(l.finishedAt)],
    ["耗时",l.durationMs!=null?(l.durationMs/1000).toFixed(1)+"s":"—"],["taskId",`<span class="mono">${esc(l.taskId||"—")}</span>`]];
  // 链路扣费明细（第124轮）：归属链各级渠道商的结算侧实扣（直属商→根，根级=源站实收）——源站全见
  const chain = Array.isArray(l.agentCosts) && l.agentCosts.length
    ? `<div class="badge plain" style="margin-bottom:12px;max-width:100%;white-space:normal">链路扣费：用户 ${l.cost!=null?l.cost:"—"} · ${l.agentCosts.map(a=>`${esc(a.name||a.id)} ${a.cost}`).join(" · ")} <span class="faint">（根级=源站实收 ${l.agentCosts[l.agentCosts.length-1].cost} 积分；失败已逐级退回）</span></div>`
    : "";
  // 四栏 2×2：左列请求（①③）、右列响应（②④）——读序 ①③②④；每格独立可复制
  const cell = (t, seg) => `<div class="logcell"><div class="lc-t">${t} <button class="sm ghost icon" title="复制本段" onclick="copyText(window.__logSegs['${seg}'],'本段已复制')"><svg><use href="#i-copy"/></svg></button></div><pre>${esc(window.__logSegs[seg])}</pre></div>`;
  $("#dlgTitle").innerHTML = `请求详情 &nbsp;${statusBadge(l.status)}`;
  $("#dlgBody").innerHTML = `
    ${backAgentId?`<div style="margin-bottom:10px"><button class="sm" onclick="dlg.close();openAgentDetail('${esc(backAgentId)}','logs')">← 返回渠道商请求记录</button></div>`:""}
    ${backUser&&ULOG?`<div style="margin-bottom:10px"><button class="sm" onclick="openUserLogs(ULOG.id, ULOG.name)">← 返回该用户请求记录</button></div>`:""}
    <div class="metagrid">${meta.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    ${chain}
    ${l.error?`<div class="badge bad" style="margin-bottom:12px;max-width:100%;white-space:normal">错误：${esc(l.error)}</div>`:""}
    ${l.detailPruned?`<div class="badge run" style="margin-bottom:12px;max-width:100%;white-space:normal">详情报文已清除（保留策略：完整详情仅保留 3 天，3~30 天仅保留记录，超过 30 天整条清除）</div>`:""}
    <div class="loggrid">
      ${cell("① 用户 → 管理端 请求","s1")}
      ${cell("③ 管理端 → 上游 请求","s3")}
      ${cell("② 管理端 → 用户 响应","s2")}
      ${cell("④ 上游 → 管理端 响应","s4")}
    </div>`;
  dlg.classList.add("wide"); dlg.showModal();
}

function renderCleanup(d){

  const badge = $("#cl_badge");
  if (badge){

    badge.className = "badge " + (d.config.mode==="on" ? "bad" : d.config.mode==="dry" ? "run" : "");
  }
  const amn = d.amnestyAt
    ? `存量特赦已于 ${new Date(d.amnestyAt*1000).toLocaleString()} 执行，覆盖 ${(d.amnestyTouched||0).toLocaleString()} 条正式存量（特赦期第 ${Math.floor((Date.now()/1000-d.amnestyAt)/86400)+1} 天`+
      `${d.refBefore?`；满 30 天后请把上方「被引用」档从 ${d.days.ref} 调回 ${d.refBefore} 天`:""}）`
    : "存量特赦未执行——首次把模式拨离「关闭」时自动执行（TP 临时资产不特赦，它就是首批要清的对象）";
  const runRows = (d.runs||[]).map(r=>`<tr>
      <td class="k">${new Date(r.at*1000).toLocaleString()}</td>

/* ── 容量统计（P0）：纯服务端 SQLite 聚合，不碰 OSS，随时可刷 ── */
const humanBytes = (n) => {
  const u = ["B","KB","MB","GB","TB"]; let i=0, v=Number(n)||0;
  while (v >= 1024 && i < u.length-1) { v/=1024; i++; }
  return v.toFixed(i===0?0:2) + " " + u[i];
};
/* 一张「名称 / 数量 / 容量 / 占比条」小表；空数据出占位 */
function capTable(rows, total){
  if (!rows || !rows.length) return `<div class="mut" style="font-size:12.5px;padding:6px 0">暂无数据</div>`;
  return `<table class="cap"><tbody>` + rows.map(r => {
    const pct = total > 0 ? (r.bytes / total * 100) : 0;
    return `<tr>
      <td class="k">${esc(r.label || r.key || "（空）")}</td>
      <td class="n mut">${Number(r.n).toLocaleString()} 个</td>
      <td class="b">${humanBytes(r.bytes)}</td>
      <td class="bar"><i style="width:${pct.toFixed(1)}%"></i></td>
    </tr>`;
  }).join("") + `</tbody></table>`;
}
async function loadStorageStats(){
  const box = $("#stg_box");

  const warn = s.unsized > 0
    ? `<div class="bad-t" style="font-size:12.5px;margin:0 0 12px">
         有 <b>${s.unsized.toLocaleString()}</b> 条存活记录还没有体积数据，下面的容量是<b>不完整</b>的。
         在服务器上跑一次 <code>docker compose exec qiji-server node scripts/reconcile.mjs --apply</code> 回填后即准确。
       </div>` : "";
  box.innerHTML = warn + `
    <div class="kpis">
      <div class="kpi"><div class="k">存活素材（新 OSS）</div><div class="v">${s.live.toLocaleString()}</div><div class="d">共 ${s.rows.toLocaleString()} 条台账</div></div>
      <div class="kpi"><div class="k">占用容量（新 OSS）</div><div class="v">${humanBytes(s.bytes)}</div><div class="d">仅我们在管的桶</div></div>

      <div class="kpi"><div class="k">已清理（墓碑）</div><div class="v">${s.purged.toLocaleString()}</div><div class="d">曾占 ${humanBytes(s.purgedBytes)}</div></div>
      <div class="kpi"><div class="k">存储档</div><div class="v">${s.profiles.length}</div><div class="d">${esc(s.profiles.filter(p=>p.active).map(p=>p.id).join("、")||"—")} 在用</div></div>
    </div>

}

  const body = {
    endpoint: $("#oss_endpoint").value.trim(), bucket: $("#oss_bucket").value.trim(),
    accessKeyId: $("#oss_ak").value.trim(), region: $("#oss_region").value.trim(),
    publicBase: $("#oss_pub").value.trim(),
  };
  const sk = $("#oss_sk").value; if (sk) body.secretAccessKey = sk; // 留空则不改
  try { const r = await api("/admin-api/settings/oss",{method:"PUT",body:JSON.stringify(body)}); toast(r.configured?"已保存":"已保存（仍未配置完整）", r.configured?"ok":"bad"); loadOss(); }
  catch(e){ toast(e.message,"bad"); }
}
async function testOss(){
  $("#oss_msg").textContent = "测试中…";
  try { const r = await api("/admin-api/settings/oss/test",{method:"POST"}); $("#oss_msg").textContent = r.ok ? ("连接正常 ✅ "+(r.url||"")) : ("失败："+r.error); if(r.ok) toast("OSS 连接正常"); else toast("OSS 测试失败","bad"); }
  catch(e){ $("#oss_msg").textContent = "失败："+e.message; toast("OSS 测试失败","bad"); }
}

/* ── Esc 关抽屉 ── */
document.addEventListener("keydown", (e)=>{ if (e.key==="Escape" && $("#drawer").classList.contains("on")) closeDrawer(); });

/* ── 启动 ── */
if (TOKEN) { api("/admin-api/users").then(showApp).catch(showLogin); } else { showLogin(); }
</script>
</body>
</html>
