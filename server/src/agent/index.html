<style>
  :root {
    color-scheme: dark;
    --bg: #0c0e13; --panel: #12151d; --panel2: #181c27; --panel3: #1f2433;
    --line: #232939; --line2: #2d3448;
    --text: #e7eaf3; --mut: #8a91a6; --faint: #59607a;
    --acc: #5aa7f0; --acc-deep: #3a6fd0; --acc-dim: rgba(90,167,240,.14);
    --ok: #41d392; --ok-dim: rgba(65,211,146,.13);
    --warn: #f3b74f; --warn-dim: rgba(243,183,79,.13);
    --bad: #f26d8d; --bad-dim: rgba(242,109,141,.12);
    --info: #8b7cf7; --info-dim: rgba(139,124,247,.13);
    --r-lg: 12px; --r-md: 9px; --r-sm: 6px;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; border-radius: 4px; }
  .hide { display: none !important; }
  .mono { font-family: var(--mono); font-size: 12px; }
  td.mono, td .mono { white-space: nowrap; }
  .mut { color: var(--mut); } .faint { color: var(--faint); }
  .ok-t { color: var(--ok); } .bad-t { color: var(--bad); }

  .shell { display: flex; min-height: 100vh; }
  .side { width: 212px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; flex: none; background: #fff; display: grid; place-items: center; overflow: hidden; }
  .brand .logo img { width: 76%; height: 76%; object-fit: contain; display: block; }
  .brand b { font-size: 15px; font-weight: 600; }
  .brand .env { margin-left: auto; font-size: 10.5px; color: var(--acc); border: 1px solid rgba(90,167,240,.35); border-radius: 999px; padding: 1px 7px; }
  .nav { flex: 1; overflow-y: auto; padding: 2px 10px 10px; }
  .nav .grp { font-size: 11px; color: var(--faint); letter-spacing: 2px; padding: 13px 10px 4px; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin: 1px 0; border-radius: var(--r-md); color: var(--mut); text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: background .12s, color .12s; }
  .nav a:hover { background: var(--panel2); color: var(--text); }
  .nav a.on { background: var(--acc-dim); color: #bcd8f6; border-color: rgba(90,167,240,.22); }
  .nav a svg { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav a .n { font-size: 13.5px; }
  .nav a .cnt { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .side .me { border-top: 1px solid var(--line); padding: 11px 14px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mut); }
  .side .me .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--ok); flex: none; }
  .side .me button { margin-left: auto; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: rgba(12,14,19,.86); backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 20; }
  .top h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .top .sp { flex: 1; }
  .balance { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--line2); border-radius: 999px; padding: 5px 15px; }
  .balance .k { font-size: 11.5px; color: var(--mut); }
  .balance .v { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .views { padding: 20px 24px 60px; }

  button, .btn { font: inherit; font-size: 13px; color: var(--text); cursor: pointer; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 6px 13px; transition: background .12s, border-color .12s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover { background: var(--panel3); }
  button.pri { background: var(--acc-deep); border-color: var(--acc-deep); color: #fff; font-weight: 500; }
  button.pri:hover { background: var(--acc); border-color: var(--acc); }
  button.ghost { background: none; border-color: transparent; color: var(--mut); }
  button.ghost:hover { background: var(--panel2); color: var(--text); }
  button.danger { background: var(--bad-dim); border-color: rgba(242,109,141,.35); color: var(--bad); }
  button.danger:hover { background: rgba(242,109,141,.2); }
  button.sm { padding: 3px 9px; font-size: 12px; border-radius: var(--r-sm); }
  button.icon { padding: 5px 7px; }
  button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  button:disabled { opacity: .45; cursor: default; }

  input[type=text], input[type=number], input[type=password], input[type=date], select, textarea {
    font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 6px 10px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(90,167,240,.15); }
  input::placeholder { color: var(--faint); }
  td input[type=text], td input[type=number], td select { padding: 3px 7px; font-size: 12.5px; background: transparent; border-color: transparent; border-radius: var(--r-sm); }
  td input:hover, td select:hover { border-color: var(--line2); background: var(--bg); }
  td input:focus { border-color: var(--acc); background: var(--bg); box-shadow: none; }
  td input[type=checkbox] { accent-color: var(--acc-deep); }

  .search { position: relative; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 1.8; }
  .search input { padding-left: 32px; width: 250px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line2); color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
  .badge.ok { color: var(--ok); background: var(--ok-dim); border-color: rgba(65,211,146,.3); }
  .badge.run { color: var(--warn); background: var(--warn-dim); border-color: rgba(243,183,79,.3); }
  .badge.bad { color: var(--bad); background: var(--bad-dim); border-color: rgba(242,109,141,.3); }
  .badge.plain::before { display: none; }
  .badge.info { color: var(--acc); background: rgba(91,140,255,.12); border-color: rgba(91,140,255,.3); }
  .badge.info::before { display: none; }

  .chip { font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer; color: var(--mut); background: none; border: 1px solid var(--line); user-select: none; }
  .chip:hover { color: var(--text); background: var(--panel2); }
  .chip.on { color: #bcd8f6; background: var(--acc-dim); border-color: rgba(90,167,240,.35); }

  .sw { position: relative; display: inline-block; width: 32px; height: 18px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--panel3); border: 1px solid var(--line2); transition: background .15s; cursor: pointer; }
  .sw i::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 99px; background: var(--mut); top: 2px; left: 2px; transition: transform .15s, background .15s; }
  .sw input:checked + i { background: var(--acc-deep); border-color: var(--acc-deep); }
  .sw input:checked + i::after { transform: translateX(14px); background: #fff; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 13px 16px; }
  .kpi .k { font-size: 12px; color: var(--mut); }
  .kpi .v { font-size: 23px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .kpi .d { font-size: 11.5px; margin-top: 2px; color: var(--faint); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 14px; }
  .card .hd { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .card .hd h3 { font-size: 13.5px; font-weight: 600; margin: 0; }
  .card .hd .sp { flex: 1; }
  .card .bd { padding: 14px 18px; }

  .toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 13px; }
  .toolbar .sp { flex: 1; }

  .tblwrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel); margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--faint); letter-spacing: .6px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clk { cursor: pointer; }
  tr.grphead td { background: var(--panel2); font-size: 12px; font-weight: 600; color: var(--acc); padding: 6px 12px; }
  tbody tr.grphead:hover { background: var(--panel2); }
  th.sorth { cursor: pointer; user-select: none; }
  th.sorth:hover { color: var(--text); }
  th.sorth.on { color: var(--acc); }
  td .sub { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
  .tfoot { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 12px; color: var(--mut); }
  .tfoot .sp { flex: 1; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--acc-dim); color: #bcd8f6; }
  .ucell { display: flex; align-items: center; gap: 10px; }
  .modechips { display: flex; gap: 5px; }
  .mchip { font-size: 11px; border-radius: var(--r-sm); padding: 1px 7px; border: 1px solid var(--line2); color: var(--mut); cursor: pointer; user-select: none; white-space: nowrap; transition: border-color .12s; }
  .mchip:hover { border-color: var(--acc); }
  .mchip.on { color: var(--ok); border-color: rgba(65,211,146,.35); background: var(--ok-dim); }
  .mchip.off { color: var(--faint); text-decoration: line-through; }

  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 11px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span { font-size: 11.5px; color: var(--mut); }
  .fld.full { grid-column: 1 / -1; }
  .consume { font-size: 12.5px; padding: 9px 12px; background: var(--acc-dim); border: 1px solid rgba(90,167,240,.22); border-radius: var(--r-md); }
  .consume.bad { background: var(--bad-dim); border-color: rgba(242,109,141,.3); }

  .scrim { position: fixed; inset: 0; background: rgba(5,6,10,.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 94vw; z-index: 41; background: var(--panel); border-left: 1px solid var(--line2); transform: translateX(102%); transition: transform .22s cubic-bezier(.3,.9,.3,1); display: flex; flex-direction: column; box-shadow: -18px 0 50px rgba(0,0,0,.4); }
  .drawer.on { transform: none; }
  .drawer .dh { display: flex; align-items: center; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
  .drawer .dh h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .drawer .db { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  .dsec { margin-bottom: 20px; }
  .dsec > .t { font-size: 11px; color: var(--faint); letter-spacing: 1.5px; margin-bottom: 8px; }
  .frow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .frow > label { width: 78px; flex: none; font-size: 12.5px; color: var(--mut); }
  .frow input[type=text], .frow input[type=number] { flex: 1; min-width: 0; }
  .frow .val { flex: 1; min-width: 0; }
  .frow .val.mono { white-space: normal; word-break: break-all; }
  .swrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .swrow:last-child { border-bottom: none; }
  .swrow .nm { font-size: 13px; } .swrow .ds { font-size: 11.5px; color: var(--faint); } .swrow .sp { flex: 1; }
  .dangerzone { border: 1px solid rgba(242,109,141,.3); border-radius: var(--r-md); padding: 11px 14px; background: var(--bad-dim); display: flex; align-items: center; gap: 10px; }
  .dangerzone .tx { font-size: 12.5px; color: var(--mut); flex: 1; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 14px; max-width: 640px; width: 92vw; padding: 0; box-shadow: 0 26px 70px rgba(0,0,0,.5); }
  dialog.wide { max-width: 1100px; }
  dialog.slim { max-width: 480px; }
  dialog::backdrop { background: rgba(5,6,10,.55); }
  dialog .mh { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  dialog .mh h2 { font-size: 15px; margin: 0; font-weight: 600; }
  dialog .mh .sp { flex: 1; }
  dialog .mb { padding: 16px 20px; max-height: 76vh; overflow: auto; }
  dialog .mf { display: flex; justify-content: flex-end; gap: 9px; padding: 13px 20px; border-top: 1px solid var(--line); }

  #toasts { position: fixed; right: 22px; bottom: 22px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
  .toast { display: flex; align-items: center; gap: 9px; background: var(--panel3); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 10px 15px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: tin .18s ease-out; max-width: 420px; }
  .toast.ok { border-color: rgba(65,211,146,.4); } .toast.ok::before { content: "✓"; color: var(--ok); font-weight: 700; }
  .toast.bad { border-color: rgba(242,109,141,.4); } .toast.bad::before { content: "✕"; color: var(--bad); font-weight: 700; }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } }

  .filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 14px; margin-bottom: 13px; }
  .filterbar .div { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: none; padding: 5px 11px; font-size: 12px; color: var(--mut); }
  .seg button.on { background: var(--acc-dim); color: #bcd8f6; }
  .logtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .logtabs button { border: none; background: none; border-radius: 6px 6px 0 0; padding: 8px 14px; font-size: 12.5px; color: var(--mut); border-bottom: 2px solid transparent; }
  .logtabs button.on { color: var(--text); border-bottom-color: var(--acc); }
  .jsonbox { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow: auto; max-height: 52vh; position: relative; white-space: pre-wrap; word-break: break-all; }
  .copyfab { position: absolute; top: 8px; right: 8px; }
  .metagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .metagrid .k { font-size: 11px; color: var(--faint); }
  .metagrid .v { font-size: 13px; margin-top: 1px; word-break: break-all; }

  /* 统计（纯文字，无图表） */
  .statlists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 13px; margin-bottom: 16px; }
  .statlist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; }
  .statlist h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--mut); font-weight: 600; }
  .statlist .row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; font-size: 12.5px; border-top: 1px solid var(--line); }
  .statlist .row:first-of-type { border-top: none; }
  .statlist .row .lb { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statlist .row .vl { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--faint); flex: none; }
  .statlist .empty { font-size: 12px; color: var(--faint); padding: 4px 0; }

  /* 提示词模板双栏 */
  .tpl { display: grid; grid-template-columns: 300px 1fr; gap: 15px; align-items: stretch; height: calc(100vh - 116px); }
  @media (max-width: 1080px) { .tpl { grid-template-columns: 1fr; height: auto; } }
  .tpllist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .tpllist .lh { padding: 11px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex: none; }
  .tpllist .lh input { flex: 1; min-width: 0; }
  .tpllist .lbody { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
  .tpllist .grp { font-size: 11px; color: var(--faint); letter-spacing: 1px; padding: 12px 14px 4px; }
  .tpllist .it { padding: 7px 14px; cursor: pointer; border-left: 2px solid transparent; }
  .tpllist .it:hover { background: var(--panel2); }
  .tpllist .it.on { background: var(--acc-dim); border-left-color: var(--acc); }
  .tpllist .it.dis { opacity: .5; }
  .tpllist .it .nm { font-size: 13px; }
  .tpllist .it .id { font-size: 11px; color: var(--faint); font-family: var(--mono); }
  .tpled { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow-y: auto; min-height: 0; }
  .tpled .hd { position: sticky; top: 0; z-index: 2; background: var(--panel); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .bodyed { width: 100%; min-height: 52vh; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; resize: vertical; }
  .varchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .varchip { font-size: 11.5px; font-family: var(--mono); background: var(--panel3); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 2px 8px; color: #bcd8f6; cursor: pointer; }
  .loggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .logcell { min-width: 0; }
  .logcell .lc-t { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); margin-bottom: 5px; }
  .logcell pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; max-height: 40vh; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 900px) { .loggrid { grid-template-columns: 1fr; } }

  #login { min-height: 100vh; display: grid; place-items: center; }
  #login .box { width: 380px; max-width: 92vw; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px 30px 26px; }
  #login .lg { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  #login .lg img.biglogo { height: 56px; display: block; }
  #login h2 { margin: 0; font-size: 17px; }
  #login .f { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
</style>
</head>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN = localStorage.getItem("qiji_agent_token") || "";
let ME = null;

async function api(path, opts={}) {
  const headers = { Authorization: "Bearer " + TOKEN, ...(opts.body!=null ? {"Content-Type":"application/json"} : {}), ...(opts.headers||{}) };
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) { logout(); throw new Error("会话已过期，请重新登录"); }
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e?.error?.message || ("HTTP " + r.status)); }
  return r.status === 204 ? null : r.json();
}
function toast(msg, kind="ok"){ const t=document.createElement("div"); t.className="toast "+kind; t.textContent=msg; $("#toasts").appendChild(t); setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";},2600); setTimeout(()=>t.remove(),3000); }
function confirmDo({ title, text, okLabel="确认", danger=true, onOk }){ $("#cfmTitle").textContent=title; $("#cfmTitle").style.color=danger?"var(--bad)":""; $("#cfmBody").innerHTML=text; const ok=$("#cfmOk"); ok.className=danger?"danger":"pri"; ok.textContent=okLabel; ok.onclick=()=>{cfm.close();onOk();}; cfm.showModal(); }
function copyText(s, msg){ navigator.clipboard.writeText(s); toast(msg||"已复制"); }
function relTime(t){ if(!t)return""; const d=Date.now()-new Date(t).getTime(); if(d<60e3)return"刚刚"; if(d<3600e3)return Math.floor(d/60e3)+" 分钟前"; if(d<86400e3)return Math.floor(d/3600e3)+" 小时前"; return Math.floor(d/86400e3)+" 天前"; }
function downloadCsv(rows, baseName){ const csv="﻿"+rows.map(r=>r.map(c=>{const s=String(c??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\r\n"); const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=baseName+"-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"")+".csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

/* ── 登录 ── */
function showLogin(){ $("#login").classList.remove("hide"); $("#app").classList.add("hide"); }
function showApp(){ $("#login").classList.add("hide"); $("#app").classList.remove("hide"); switchTab("users"); }
async function doLogin(){
  const account = $("#lg_acc").value.trim(), password = $("#lg_pw").value;
  try {
    const r = await fetch("/agent-api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({account, password}) });
    if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e?.error?.message || "登录失败"); }
    const data = await r.json();
    TOKEN = data.token; localStorage.setItem("qiji_agent_token", TOKEN);
    await refreshMe(); showApp();
  } catch(e){ $("#loginErr").textContent = e.message; $("#loginErr").classList.remove("hide"); }
}
function logout(){ localStorage.removeItem("qiji_agent_token"); TOKEN=""; ME=null; showLogin(); }
async function refreshMe(){
  ME = await api("/agent-api/me");
  $("#bal").textContent = (ME.credits||0).toLocaleString();
  $("#me_name").textContent = ME.name || "渠道商";

}

/* ════════════════ 批量下载（第232轮）════════════════
   把名下用户的成功产物摊平成清单：按 时间/用户/步骤/模型/类型/保存情况 筛，

   ⚠ 原链是时效链接（各家 2~24h 不等）；部分渠道原链下载须带上游密钥 → 标「需代下」，直连必失败。 */
let dlFilter = { rangeKey:"today", user:"", purpose:"", model:"", storage:"raw", kind:"" };
let dlManifest = null, dlFacetsCache = null;
const DL_BROWSER_MAX = 50;
const DL_STORAGE_OPTS = [["","全部保存情况"],["raw","仅上游原链（需抢救）"],["oss","仅已存 OSS"],["oss-old","仅旧桶（已舍弃）"],["local","仅服务端兜底链"]];
const DL_KIND_OPTS = [["","全部类型"],["image","图片"],["video","视频"],["audio","音频"],["other","其他"]];
const DL_STORAGE_LABEL = { oss:"已存 OSS", "oss-old":"旧桶（已舍弃）", local:"服务端兜底链", raw:"上游原链" };
const DL_RISK_BADGE = { none:`<span class="badge ok">永久</span>`, low:`<span class="badge ok">较新</span>`,
  high:`<span class="badge run">可能已过期</span>`, expired:`<span class="badge bad">大概率已失效</span>` };
function readDlInputs(){ const u=$("#d_user"),p=$("#d_purpose"),m=$("#d_model");
  if(u)dlFilter.user=u.value.trim(); if(p)dlFilter.purpose=p.value.trim(); if(m)dlFilter.model=m.value.trim(); }
function setDlRange(k){ readDlInputs(); dlFilter.rangeKey=k; loadDownloads(true); }
function setDlStorage(v){ readDlInputs(); dlFilter.storage=v; loadDownloads(true); }
function setDlKind(v){ readDlInputs(); dlFilter.kind=v; loadDownloads(true); }
function applyDlFilter(){ readDlInputs(); loadDownloads(true); }
function clearDlFilter(){ dlFilter.user=dlFilter.purpose=dlFilter.model=""; dlFilter.storage=""; dlFilter.kind=""; loadDownloads(true); }
function dlQuery(){
  const r = computeRange(dlFilter.rangeKey);
  const qs = new URLSearchParams();
  if (r.from!=null) qs.set("from", String(r.from));
  if (r.to!=null) qs.set("to", String(r.to));
  if (dlFilter.user) qs.set("user", dlFilter.user);
  if (dlFilter.purpose) qs.set("purpose", dlFilter.purpose);
  if (dlFilter.model) qs.set("model", dlFilter.model);
  if (dlFilter.storage) qs.set("storages", dlFilter.storage);
  if (dlFilter.kind) qs.set("kinds", dlFilter.kind);
  return qs.toString();
}
async function loadDownloads(reset=true){
  const el = $("#tab-downloads");
  if (reset){
    if (!dlFacetsCache){ try { dlFacetsCache = await api("/agent-api/logs/facets"); } catch { dlFacetsCache={users:[],purposes:[],models:[]}; } }
    const f = dlFacetsCache;

async function exportDlManifest(){
  if (!dlManifest || !dlManifest.total){ toast("该筛选条件下暂无产物","bad"); return; }
  const blob = new Blob([JSON.stringify(dlManifest, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "qiji-downloads-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"")+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`已导出 ${dlManifest.total} 个产物的清单`);
}
function exportDlCsv(){
  if (!dlManifest || !dlManifest.total){ toast("该筛选条件下暂无产物","bad"); return; }
  const rows = [["用户","时间","步骤","模型","类型","保存情况","链接状态","需代下","建议路径","链接","日志ID"]];
  dlManifest.items.forEach(it=>rows.push([it.user, fmtTime(it.startedAt), it.purposeLabel, it.model, it.kind,
    DL_STORAGE_LABEL[it.storage]||it.storage, it.expiryRisk, it.authRequired?"是":"否", it.suggestedPath, it.url, it.logId]));
  downloadCsv(rows, "qiji-downloads");
}
async function browserDownloadAll(){
  if (!dlManifest || !dlManifest.total){ toast("该筛选条件下暂无产物","bad"); return; }
  const all = dlManifest.items.filter(i=>!i.authRequired);
  const skipped = dlManifest.total - all.length;
  const batch = all.slice(0, DL_BROWSER_MAX);
  if (!batch.length){ toast("可直连的产物为 0（全部需服务端代下）","bad"); return; }
  confirmDo({
    title:"在浏览器里下载",
    text:`将依次下载 <b>${batch.length}</b> 个文件${all.length>batch.length?`（共 ${all.length} 个可直连，本次只下前 ${DL_BROWSER_MAX} 个）`:""}${skipped?`，另有 <b>${skipped}</b> 个需服务端代下已跳过`:""}。<br>浏览器会逐个弹下载，<b>不会自动分目录</b>；大批量请用「导出清单 JSON」+ 独立下载器。`,
    okLabel:"开始下载", danger:false,
    onOk: async ()=>{
      let done=0, failed=0;
      for (const it of batch){
        $("#d_selinfo").textContent = `下载中 ${done+failed+1}/${batch.length}…`;
        try {
          const r = await fetch(it.url, { mode:"cors" });
          if (!r.ok) throw new Error("HTTP "+r.status);
          const b = await r.blob();
          const a = document.createElement("a"); a.href = URL.createObjectURL(b);
          a.download = it.suggestedPath.split("/").pop();
          a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
          done++;
        } catch { window.open(it.url, "_blank", "noopener"); failed++; }
        await new Promise(res=>setTimeout(res, 220));
      }
      $("#d_selinfo").textContent = `完成：直接保存 ${done} 个${failed?`，另有 ${failed} 个跨域受限已改为新窗口打开`:""}`;
      toast(`下载完成（${done} 个已保存${failed?`，${failed} 个转新窗口`:""}）`);
    },
  });
}

/* ════════════════ 模型（P1 统一定价：只读平台价 + 启停 + 显示名）════════════════ */
const CAP_LABELS = { text:"文本", image:"图像", video:"视频", audio:"音频", "video-enhance":"视频超分", "video-erase":"视频去字幕", "image-enhance":"图像超分" };
let PMODELS = [];
/* 定价表按模式分组（第131轮）：默认模式在前，其余按模式名排序；组内保持模型清单序 */
function groupByMode(items){
  const groups = {};
  items.forEach(m=>{ const k = m.modeId||""; (groups[k]=groups[k]||{name:m.modeName||"默认模式（常开）",list:[]}).list.push(m); });
  return Object.keys(groups).sort((a,b)=> a===""?-1 : b===""?1 : groups[a].name.localeCompare(groups[b].name)).map(k=>groups[k]);
}
const unitName = (f) => f==="duration" ? "秒" : (f||"单位");
/* 档位条件签名/显示名（签名口径与服务端 pricingWhenKey 一致：键排序后 JSON） */
const whenKey = (w) => JSON.stringify(Object.entries(w||{}).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0));
const whenLabel = (w) => Object.values(w||{}).map(esc).join("/") || "默认";
function priceRuleDesc(r, field){
  const cond = Object.values(r.when||{}).map(esc).join("/") || "默认";
  const parts = [];
  if (field && r.costPerUnit!=null) parts.push(r.costPerUnit+" 积分/"+esc(unitName(field)));
  if (r.cost!=null) parts.push(r.cost+" 积分/次");
  return parts.length ? cond+" "+parts.join("，") : "";

/* ── 模型表（P1 统一定价瘦身）：单行紧凑 · 状态/分组筛选 · 显示名暂存 + 一键保存 · 启停即时生效 ── */
let P_EDIT = {};            // modelId → { label? } 输入原始串暂存（筛选/分组重渲染不丢）
let pChip = "on", pGroup = "mode"; // 状态筛选（on/off/all）· 分组（mode/channel）
function pmEdit(id){ return P_EDIT[id] = P_EDIT[id] || {}; }
function pmVal(id, key, orig){ const e = P_EDIT[id]; if (e && (key in e)) return e[key]; return orig != null ? String(orig) : ""; }
function pmIn(id, key, v){ pmEdit(id)[key] = v; updateSaveBtn(); }
function modelDirty(m){
  const e = P_EDIT[m.id]; if (!e) return false;
  return ("label" in e) && e.label.trim() !== (m.myLabel != null ? String(m.myLabel) : "");
}
function dirtyCount(){ return PMODELS.filter(modelDirty).length; }
function updateSaveBtn(){ const b = $("#pm_saveall"); if (!b) return; const n = dirtyCount(); b.disabled = n===0; b.textContent = n ? `保存全部修改（${n}）` : "保存全部修改"; }
function groupModelsBy(items, keyF, nameF){
  const groups = {};
  items.forEach(m=>{ const k = keyF(m); (groups[k]=groups[k]||{name:nameF(m),list:[]}).list.push(m); });
  return Object.keys(groups).sort((a,b)=> a===""?-1 : b===""?1 : groups[a].name.localeCompare(groups[b].name)).map(k=>groups[k]);
}
function platBase(m){
  return m.costField
    ? (m.costPerUnit!=null ? `${m.costPerUnit} 积分/${esc(unitName(m.costField))}` : "按档位")
    : `${m.cost} 积分/次`;
}
function platTitle(m){
  const rules = (m.costRules||[]).map(r=>priceRuleDesc(r, m.costField)).filter(Boolean);
  const parts = [];
  if (m.costField) parts.push(`兜底 ${m.cost} 积分/次`);
  if (rules.length) parts.push("档位："+rules.join("；"));

function pmRow(m){

    <td>${m.hidden ? `<span class="faint">—</span>` : `<input type="text" maxlength="40" style="width:150px;font-size:12px" placeholder="${esc(m.label)}" value="${esc(pmVal(m.id,"label",m.myLabel))}" oninput="pmIn('${esc(m.id)}','label',this.value)" onkeydown="if(event.key==='Enter')saveAllPricing()" title="改名后你的用户在客户端看到的名称；留空=平台名" />`}</td>

function renderPricing(){

/* 启用/禁用（即时生效，不进「保存全部」）：写本商 blockedModels——名下用户 catalog 隐藏 + 调用 403；解禁即恢复 */
async function toggleModelAccess(id, enabled){
  const m = PMODELS.find(x=>x.id===id); if (!m) return;
  try {
    await api("/agent-api/models/"+encodeURIComponent(id)+"/access",{ method:"PUT", body: JSON.stringify({ blocked: !enabled }) });
    m.myBlocked = !enabled;
    toast(enabled ? "已启用，用户端 ≤30s 恢复该模型" : "已禁用：你的用户不可再用该模型（≤30s 生效）");
  } catch(e){ toast(e.message,"bad"); }

}

async function saveAllPricing(){
  const jobs = PMODELS.filter(modelDirty);

  const btn = $("#pm_saveall"); if (btn){ btn.disabled = true; btn.textContent = "保存中…"; }
  let okN = 0; const fails = [];
  for (const m of jobs){
    try {
      const r = await api("/agent-api/models/"+encodeURIComponent(m.id)+"/label",{ method:"PUT", body: JSON.stringify({ label: pmVal(m.id,"label",m.myLabel).trim() }) });
      m.myLabel = r.myLabel; const e = P_EDIT[m.id]; if (e) delete e.label; okN++;
    } catch(err){ fails.push(`${m.label}：${err.message}`); }
  }
  renderPricing();
  if (fails.length) toast(`已保存 ${okN} 项；${fails.length} 项失败：${fails[0]}`,"bad");

}

  if (!id){ $("#nt_err").textContent = "请填模板 id"; return; }
  try { const t = await api("/agent-api/templates",{method:"POST",body:JSON.stringify({ id, name:$("#nt_name").value.trim()||id, capability:$("#nt_cap").value, purpose:$("#nt_purpose").value||undefined, category:$("#nt_cat").value.trim()||undefined, variables:[], body:"", isDefault:false, order:0 })});
    dlg.close(); toast("模板已创建"); tplSel = t.id; loadTemplates();
  } catch(e){ $("#nt_err").textContent = e.message; }
}

  $("#dlgTitle").textContent = "克隆模板 · " + id;

async function cloneTpl(id){
  const src = TPLS.find(x=>x.id===id); if(!src) return;
  const nid = $("#ct_id").value.trim();
  if (!nid){ $("#ct_err").textContent = "请填新模板 id"; return; }
  try { const t = await api("/agent-api/templates",{method:"POST",body:JSON.stringify({ id:nid, name:(src.name||id)+"（副本）", capability:src.capability, purpose:src.purpose||undefined, category:src.category||undefined, variables:src.variables||[], body:src.body||"", isDefault:false, order:(src.order||0)+1 })});
    dlg.close(); toast("已克隆"); tplSel = t.id; loadTemplates();
  } catch(e){ $("#ct_err").textContent = e.message; }
}
function delTpl(id){ confirmDo({ title:"删除模板", text:`删除自营模板「<b>${esc(id)}</b>」？删除后你名下用户将不再能用它。`, okLabel:"删除", onOk: async ()=>{ try { await api("/agent-api/templates/"+id,{method:"DELETE"}); toast("已删除"); if(tplSel===id)tplSel=""; loadTemplates(); } catch(e){ toast(e.message,"bad"); } }}); }

/* ════════════════ 统计（独立页，按用户/时间/模型筛选；纯文字无图表）════════════════ */
let statFilter = { rangeKey:"7d", user:"", model:"" };
let statFacetsCache = null;
function readStatInputs(){ const u=$("#sf_user"), m=$("#sf_model"); if(u)statFilter.user=u.value.trim(); if(m)statFilter.model=m.value.trim(); }
function applyStatFilter(){ readStatInputs(); refreshStats(); }
function clearStatFilter(){ statFilter.user=statFilter.model=""; refreshStats(); }
function setStatRange(key){ readStatInputs(); statFilter.rangeKey=key; refreshStats(); }
async function loadStats(){
  const el = $("#tab-stats");
  if (!statFacetsCache){ try { statFacetsCache = await api("/agent-api/logs/facets"); } catch { statFacetsCache={users:[],purposes:[],models:[]}; } }
  const f = statFacetsCache;
  el.innerHTML = `
    <div class="filterbar">
      <div class="seg">${LOG_RANGES.map(([k,lb])=>`<button class="${statFilter.rangeKey===k?'on':''}" onclick="setStatRange('${k}')">${lb}</button>`).join("")}</div>
      <div class="div"></div>
      <input id="sf_user" type="text" value="${esc(statFilter.user)}" placeholder="按用户" list="dl_suser" style="width:120px" onkeydown="if(event.key==='Enter')applyStatFilter()">
      <input id="sf_model" type="text" value="${esc(statFilter.model)}" placeholder="按模型" list="dl_smodel" style="width:140px" onkeydown="if(event.key==='Enter')applyStatFilter()">
      <button class="sm" onclick="applyStatFilter()">应用</button>
      <button class="sm ghost" onclick="clearStatFilter()">清空</button>
      <span class="sp"></span>
      <button class="sm" onclick="statFacetsCache=null;loadStats()"><svg><use href="#i-refresh"/></svg>刷新</button>
      ${selDatalist("dl_suser", f.users)}${selDatalist("dl_smodel", f.models)}
    </div>
    <div class="kpis" id="s_kpis"><div class="faint" style="font-size:12px">统计加载中…</div></div>
    <div class="statlists" id="s_lists"></div>`;
  refreshStats();
}
function statQs(){
  const r = computeRange(statFilter.rangeKey);
  const qs = new URLSearchParams();
  if (r.from!=null) qs.set("from", String(r.from));
  if (r.to!=null) qs.set("to", String(r.to));
  if (statFilter.user) qs.set("user", statFilter.user);
  if (statFilter.model) qs.set("model", statFilter.model);
  return qs;
}
async function refreshStats(){
  try {
    const s = await api("/agent-api/logs/summary?"+statQs().toString());
    const kpis = [["总请求",s.total],["成功",s.success],["失败",s.failed],["进行中",s.running],["消耗（积分）",s.credits]];
    $("#s_kpis").innerHTML = kpis.map(([k,v])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${Number(v).toLocaleString()}</div></div>`).join("");
    const listCard = (title, rows) => `<div class="statlist"><h4>${title}</h4>${rows.length?rows.map(([lb,vl])=>`<div class="row"><span class="lb" title="${esc(lb)}">${esc(lb)}</span><span class="vl">${esc(vl)}</span></div>`).join(""):`<div class="empty">暂无数据</div>`}</div>`;
    const bm = s.byModel.map(m=>[m.key, `${m.count} 次 · ${Number(m.credits).toLocaleString()} 积分`]);
    const bu = s.byUser.map(u=>[u.name, `${u.count} 次 · ${Number(u.credits).toLocaleString()} 积分`]);
    const bp = s.byPurpose.map(p=>[p.label, p.count+" 次"]);
    $("#s_lists").innerHTML = listCard("按模型", bm) + listCard("按名下用户", bu) + listCard("按步骤", bp);
  } catch(e){ $("#s_kpis").innerHTML = `<div class="bad-t" style="font-size:12px">统计加载失败：${esc(e.message)}</div>`; }
}

/* ════════════════ 请求记录（名下用户，详情仅 ①②段）════════════════ */
const PURPOSE_LABELS = { "script.toScenes":"小说转剧本","script.analyze":"剧本分析","storyboard.split":"剧本分镜","storyboard.toImagePrompt":"故事板提示词","storyboard.toVideoPrompt":"视频提示词（多卡）","storyboard.singleShot":"单卡推理","storyboard.unified":"图视同源（多卡）","storyboard.unifiedShot":"图视同源（单卡）","asset.character.image":"角色出图","asset.character.variant":"角色变体","asset.scene.image":"场景出图","asset.scene.variant":"场景变体","asset.creature.image":"生物出图","asset.creature.variant":"生物变体","asset.prop.image":"物品出图","asset.prop.variant":"物品变体","video.generate":"视频生成","audio.tts":"语音合成","video.upscale":"视频超分","video.desub":"视频去字幕","image.upscale":"图像超分","chat.reply":"AI 对话","chat.summarize":"对话总结" };
const purposeLabel = (p) => PURPOSE_LABELS[p] || p || "—";
let logOffset = 0, logFacetsCache = null;
let logFilter = { rangeKey:"today", user:"", purpose:"", model:"", status:"" };
function dayStartMs(t){ const x=new Date(t); x.setHours(0,0,0,0); return x.getTime(); }
function computeRange(key){ const now=Date.now(),today=dayStartMs(now),DAY=86400000; if(key==="today")return{from:today,to:now}; if(key==="yesterday")return{from:today-DAY,to:today}; if(key==="2ago")return{from:today-2*DAY,to:today-DAY}; if(key==="7d")return{from:today-6*DAY,to:now}; if(key==="30d")return{from:today-29*DAY,to:now}; return{from:undefined,to:undefined}; }
const LOG_RANGES = [["today","今天"],["yesterday","昨天"],["2ago","前天"],["7d","近 7 天"],["30d","近 30 天"],["all","全部"]];
function selDatalist(id,list){ return `<datalist id="${id}">${(list||[]).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`; }
function readLogInputs(){ const u=$("#f_user"),p=$("#f_purpose"),m=$("#f_model"),s=$("#f_status"); if(u)logFilter.user=u.value.trim(); if(p)logFilter.purpose=p.value.trim(); if(m)logFilter.model=m.value.trim(); if(s)logFilter.status=s.value; }
function applyLogFilter(){ readLogInputs(); loadLogs(true); }
function clearLogFilter(){ logFilter.user=logFilter.purpose=logFilter.model=logFilter.status=""; loadLogs(true); }
function setLogRange(key){ readLogInputs(); logFilter.rangeKey=key; loadLogs(true); }
function fmtTime(s){ return s ? new Date(s).toLocaleString() : "—"; }
const statusBadge = (s) => s==="success"?`<span class="badge ok">成功</span>`:s==="failed"?`<span class="badge bad">失败</span>`:`<span class="badge run">进行中</span>`;
async function loadLogs(reset=true){
  if (reset) logOffset = 0;
  const el = $("#tab-logs");
  if (reset){
    if (!logFacetsCache){ try { logFacetsCache = await api("/agent-api/logs/facets"); } catch { logFacetsCache={users:[],purposes:[],models:[]}; } }
    const f = logFacetsCache;
    el.innerHTML = `
      <div class="filterbar">
        <div class="seg">${LOG_RANGES.map(([k,lb])=>`<button class="${logFilter.rangeKey===k?'on':''}" onclick="setLogRange('${k}')">${lb}</button>`).join("")}</div>
        <div class="div"></div>
        <input id="f_user" type="text" value="${esc(logFilter.user)}" placeholder="用户" list="dl_user" style="width:110px" onkeydown="if(event.key==='Enter')applyLogFilter()">
        <input id="f_purpose" type="text" value="${esc(logFilter.purpose)}" placeholder="步骤（如 视频生成）" list="dl_purpose" style="width:150px" onkeydown="if(event.key==='Enter')applyLogFilter()">
        <input id="f_model" type="text" value="${esc(logFilter.model)}" placeholder="模型" list="dl_model" style="width:130px" onkeydown="if(event.key==='Enter')applyLogFilter()">
        <select id="f_status" onchange="applyLogFilter()" style="width:92px">${[["","全部状态"],["success","成功"],["failed","失败"],["running","进行中"]].map(([v,t])=>`<option value="${v}" ${v===logFilter.status?"selected":""}>${t}</option>`).join("")}</select>
        <button class="sm" onclick="applyLogFilter()">应用</button><button class="sm ghost" onclick="clearLogFilter()">清空</button>
        <span class="sp"></span>
        <button class="sm" onclick="logFacetsCache=null;loadLogs(true)"><svg><use href="#i-refresh"/></svg>刷新</button>
        <button class="sm" onclick="exportLogsCsv()"><svg><use href="#i-dl"/></svg>导出 CSV</button>
        ${selDatalist("dl_user",f.users)}${selDatalist("dl_purpose",(f.purposes||[]).map(purposeLabel))}${selDatalist("dl_model",f.models)}
      </div>
      <div class="kpis" id="l_statbar" style="margin-bottom:13px"></div>
      <div class="tblwrap">
        <table><thead><tr><th>请求时间</th><th>完成时间</th><th style="text-align:right">用时</th><th>用户</th><th>步骤</th><th>模型</th><th style="text-align:right" title="用户请求=该用户实扣的积分（统一定价，实时扣用户）；发码记录=你的积分池划转（作废退回为负）；渠道节点请求=你的积分池实扣">消耗</th><th>状态</th></tr></thead><tbody id="l_body"></tbody></table>
        <div class="tfoot"><span id="l_meta"></span><span class="sp"></span><span class="faint">范围=你名下用户的请求 + 你的发码记录；「消耗」=用户请求显示该用户实扣的积分（统一定价，实时扣用户，失败已自动退款），发码记录显示你的积分池划转</span><button class="sm" onclick="moreLogs()">加载更多</button></div>
      </div>`;
    loadLogStatbar();
  }
  try {
    const r = computeRange(logFilter.rangeKey);
    const qs = new URLSearchParams({ limit:"50", offset:String(logOffset) });
    if (r.from!=null) qs.set("from", String(r.from));
    if (r.to!=null) qs.set("to", String(r.to));
    if (logFilter.user) qs.set("user", logFilter.user);
    if (logFilter.purpose) qs.set("purpose", logFilter.purpose);
    if (logFilter.model) qs.set("model", logFilter.model);
    if (logFilter.status) qs.set("status", logFilter.status);
    const { total, items } = await api("/agent-api/logs?"+qs.toString());
    $("#l_meta").textContent = "共 " + total + " 条（已筛选）";
    const rows = items.map(l=>`<tr class="clk" onclick="showLog('${l.id}')">
      <td class="mut">${fmtTime(l.startedAt)}</td><td class="mut">${fmtTime(l.finishedAt)}</td>
      <td class="mut" style="text-align:right">${l.durationMs!=null?(l.durationMs/1000).toFixed(1)+"s":"—"}</td>
      <td>${esc(l.userName||"—")}</td><td title="${esc(l.purpose||"")}">${esc(purposeLabel(l.purpose))}</td>
      <td class="mono">${esc(l.model||"—")}</td><td style="text-align:right">${l.cost!=null?l.cost:"—"}</td><td>${statusBadge(l.status)}</td></tr>`).join("");
    if (reset) $("#l_body").innerHTML = rows || `<tr><td colspan="8" class="faint" style="text-align:center;padding:24px">该筛选条件下暂无记录</td></tr>`;
    else $("#l_body").insertAdjacentHTML("beforeend", rows);
  } catch(e){ $("#l_body").innerHTML = `<tr><td colspan="8" class="bad-t">${esc(e.message)}</td></tr>`; }
}
function moreLogs(){ logOffset += 50; loadLogs(false); }
// 请求记录顶部简单统计条：按当前筛选（忽略状态）取聚合，四态计数都可见
async function loadLogStatbar(){
  const bar = $("#l_statbar"); if(!bar) return;
  const r = computeRange(logFilter.rangeKey);
  const qs = new URLSearchParams();
  if (r.from!=null) qs.set("from", String(r.from));
  if (r.to!=null) qs.set("to", String(r.to));
  if (logFilter.user) qs.set("user", logFilter.user);
  if (logFilter.purpose) qs.set("purpose", logFilter.purpose);
  if (logFilter.model) qs.set("model", logFilter.model);
  try {
    const s = await api("/agent-api/logs/summary?"+qs.toString());
    const kpis = [["消耗（积分）",s.credits],["成功数",s.success],["失败数",s.failed],["正在运行",s.running]];
    bar.innerHTML = kpis.map(([k,v])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${Number(v).toLocaleString()}</div></div>`).join("");
  } catch { bar.innerHTML = ""; }
}
async function exportLogsCsv(){
  readLogInputs();
  const r = computeRange(logFilter.rangeKey);
  const qs = new URLSearchParams();
  if (r.from!=null) qs.set("from", String(r.from));
  if (r.to!=null) qs.set("to", String(r.to));
  if (logFilter.user) qs.set("user", logFilter.user);
  if (logFilter.purpose) qs.set("purpose", logFilter.purpose);
  if (logFilter.model) qs.set("model", logFilter.model);
  if (logFilter.status) qs.set("status", logFilter.status);
  let items;
  try { items = (await api("/agent-api/logs/export?"+qs.toString())).items; }
  catch(e){ toast("导出失败："+e.message,"bad"); return; }
  if (!items.length){ toast("该筛选条件下暂无记录","bad"); return; }
  const rows = [["用户","请求时间","完成时间","步骤","模型","消耗","结果","失败原因"]];
  items.forEach(it=>rows.push([it.user,fmtTime(it.startedAt),fmtTime(it.finishedAt),it.purpose,it.model,it.cost,it.status,it.error]));
  downloadCsv(rows, "qiji-agent-logs");
}
async function showLog(id, backUser){
  const l = await api("/agent-api/logs/"+id);
  const prunedTxt = "（详情报文已按保留策略清除：超过 3 天的记录仅保留请求记录本身）";
  window.__logSegs = l.detailPruned ? { s1: prunedTxt, s2: prunedTxt } : { s1: JSON.stringify({ headers:l.requestHeaders, body:l.request }, null, 2), s2: JSON.stringify(l.response, null, 2) };
  const meta = [["用户",esc(l.userName||"—")],["步骤",esc(purposeLabel(l.purpose))],["模型",`<span class="mono">${esc(l.model||"—")}</span>`],["消耗",l.cost!=null?l.cost+" 积分":"—"],["请求时间",fmtTime(l.startedAt)],["完成时间",fmtTime(l.finishedAt)],["耗时",l.durationMs!=null?(l.durationMs/1000).toFixed(1)+"s":"—"]];
  // 只显 ①②（客户端请求 / 返回结果）；③④上游报文对渠道商隐藏
  const cell = (t, seg) => `<div class="logcell"><div class="lc-t">${t} <button class="sm ghost icon" title="复制本段" onclick="copyText(window.__logSegs['${seg}'],'本段已复制')"><svg><use href="#i-copy"/></svg></button></div><pre>${esc(window.__logSegs[seg])}</pre></div>`;
  $("#dlgTitle").innerHTML = `请求详情 &nbsp;${statusBadge(l.status)}`;
  $("#dlgBody").innerHTML = `
    ${backUser&&ULOG?`<div style="margin-bottom:10px"><button class="sm" onclick="openUserLogs(ULOG.id, ULOG.name)">← 返回该用户请求记录</button></div>`:""}
    <div class="metagrid">${meta.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    ${l.error?`<div class="badge bad" style="margin-bottom:12px;max-width:100%;white-space:normal">错误：${esc(l.error)}</div>`:""}
    ${l.detailPruned?`<div class="badge run" style="margin-bottom:12px;max-width:100%;white-space:normal">详情报文已清除（完整详情仅保留 3 天）</div>`:""}
    <div class="loggrid">${cell("① 客户端请求","s1")}${cell("② 返回结果","s2")}</div>`;
  dlg.classList.add("wide"); dlg.showModal();
}
/* ── 单用户请求记录（第121轮「每个用户的请求记录」）：仅名下用户；详情=①②两段（上游报文不可见） ── */
let ULOG = null, ULOG_OFFSET = 0, ULOG_TOTAL = 0;
function openUserLogs(id, name){
  ULOG = { id, name };
  $("#dlgTitle").textContent = "请求记录 · " + name;
  $("#dlgBody").innerHTML = `
    <div class="tblwrap" style="margin:0">
      <table>
        <thead><tr><th>请求时间</th><th>步骤</th><th>模型</th><th style="text-align:right" title="该用户本单实扣的积分（统一定价，实时扣用户；失败已自动退款）">消耗</th><th>状态</th><th></th></tr></thead>
        <tbody id="ulog_body"></tbody>
      </table>
      <div class="tfoot"><span id="ulog_meta"></span><span class="sp"></span><button class="sm ghost" id="ulog_more" style="display:none" onclick="loadUserLogs(true)">加载更多</button><span class="mut" style="font-size:11.5px">详情仅含 ①客户端请求 ②返回结果</span></div>
    </div>`;
  dlg.classList.add("wide"); dlg.showModal();
  loadUserLogs();
}
async function loadUserLogs(append){
  if (!ULOG || !$("#ulog_body")) return;
  if (!append){
    ULOG_OFFSET = 0;
    $("#ulog_body").innerHTML = `<tr><td colspan="6" class="mut" style="text-align:center;padding:16px">加载中…</td></tr>`;
  }
  try {
    const r = await api("/agent-api/logs?userId="+encodeURIComponent(ULOG.id)+"&limit=30&offset="+ULOG_OFFSET);
    ULOG_TOTAL = r.total;
    const rows = (r.items||[]).map(l=>`<tr>
      <td class="mut" style="white-space:nowrap">${fmtTime(l.startedAt)}</td>
      <td>${esc(purposeLabel(l.purpose))}</td>
      <td class="mono">${esc(l.model||"—")}</td>
      <td style="text-align:right">${l.cost!=null?l.cost:"—"}</td>
      <td>${statusBadge(l.status)}</td>
      <td style="text-align:right"><button class="sm" onclick="showLog('${l.id}',true)">详情</button></td>
    </tr>`).join("");
    if (append) $("#ulog_body").insertAdjacentHTML("beforeend", rows);
    else $("#ulog_body").innerHTML = rows || `<tr><td colspan="6" class="mut" style="text-align:center;padding:16px">该用户还没有请求记录</td></tr>`;
    ULOG_OFFSET += (r.items||[]).length;
    $("#ulog_meta").textContent = `共 ${ULOG_TOTAL} 条 · 已显示 ${ULOG_OFFSET}`;
    $("#ulog_more").style.display = ULOG_OFFSET < ULOG_TOTAL ? "" : "none";
  } catch(e){ $("#ulog_body").innerHTML = `<tr><td colspan="6" class="bad-t">${esc(e.message)}</td></tr>`; }
}

document.addEventListener("keydown", (e)=>{ if(e.key==="Escape" && $("#drawer").classList.contains("on")) closeDrawer(); });

/* ── 启动 ── */
/* 管理端「查看信息」免密直登：URL 带 ?imp=<token>（管理员经 /admin-api/agents/:id/impersonate 签发的
   门户会话 token）→ 直接采用为本页会话并从地址栏抹掉（防复制链接泄漏），所见与渠道商本人登录完全一致。 */
(() => {
  const imp = new URLSearchParams(location.search).get("imp");
  if (imp) {
    TOKEN = imp;
    localStorage.setItem("qiji_agent_token", TOKEN);
    history.replaceState(null, "", location.pathname);
  }
})();
if (TOKEN) { refreshMe().then(showApp).catch(showLogin); } else { showLogin(); }
</script>
